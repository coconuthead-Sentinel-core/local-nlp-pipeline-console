<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Skip link: the first thing a keyboard user meets. Free in HTML;
     there is no Tk equivalent worth writing. -->
<a class="skip" href="#composer">Skip to the message box</a>

<header class="bar" role="banner">
  <div class="brand">Strata<span>Console</span></div>

  <div class="grp" role="group" aria-label="Reading">
    <label class="lbl" for="font">Font</label>
    <select id="font" class="ctl">
      <option value="system">System</option>
      <option value="atkinson">Atkinson Hyperlegible</option>
      <option value="opendyslexic">OpenDyslexic</option>
      <option value="verdana">Verdana</option>
      <option value="serif">Serif</option>
    </select>
    <button id="smaller" class="ctl" type="button" aria-label="Smaller text">A&minus;</button>
    <button id="bigger" class="ctl" type="button" aria-label="Larger text">A+</button>
    <output id="size" class="size" aria-live="polite">17px</output>
  </div>

  <p id="status" class="status" role="status" aria-live="polite">Starting…</p>
  <!-- Free RAM, always shown. A reply takes 3 s with room and over 100 s
       without (measured); a figure seen every day is one that can be read
       at a glance when it drops. -->
  <output id="ram" class="size" title="Free physical memory"></output>
</header>

<main id="log" class="log" tabindex="0" role="log" aria-live="polite"
      aria-label="Conversation transcript"></main>

<div class="tools" role="group" aria-label="Voice and session">
  <button id="mic" class="ctl mic" type="button" aria-pressed="false">
    <span aria-hidden="true">🎤</span> Speak
  </button>
  <select id="tier" class="ctl" aria-label="Dictation accuracy">
    <option value="Fast">Fast</option>
    <option value="Accurate">Accurate</option>
    <option value="Best">Best</option>
  </select>

  <button id="read" class="ctl" type="button" aria-pressed="false">
    <span aria-hidden="true">🔊</span> Read
  </button>
  <label class="check">
    <input type="checkbox" id="autoread"> Auto
  </label>

  <!-- Focus cycle. The countdown is a live region because a number
       that changes is how the owner knows the console is alive -- the
       same lesson FB-011 taught about the twenty-second model load. -->
  <div class="grp" role="group" aria-label="Focus cycle">
    <label class="lbl" for="fx-len">Focus</label>
    <select id="fx-len" class="ctl" aria-label="Cycle length in minutes">
    </select>
    <button id="fx-start" class="ctl" type="button">Start</button>
    <button id="fx-stop" class="ctl" type="button" hidden>Stop</button>
    <output id="fx-left" class="size" aria-live="polite"
            title="Time left in this cycle"></output>
    <button id="fx-stats" class="ctl" type="button"
            title="What the recorded cycles say">Stats</button>
  </div>

  <span class="spacer"></span>

  <button id="clear" class="ctl" type="button">
    <span aria-hidden="true">🧹</span> Clear
  </button>
  <button id="help" class="ctl" type="button">Help</button>
</div>

<!-- What the assistant is allowed to read this turn. The model never
     reaches any of it: the shell fetches the text and hands it in. -->
<div class="sources" role="group" aria-label="What the assistant may read">
  <label class="check" for="src-web">
    <input type="checkbox" id="src-web">
    <span aria-hidden="true">🌐</span>&nbsp;Web search
  </label>
  <label class="check" for="src-onedrive">
    <input type="checkbox" id="src-onedrive">
    <span aria-hidden="true">☁</span>&nbsp;OneDrive files
  </label>

  <button id="upload" class="ctl" type="button">
    <span aria-hidden="true">📎</span> Upload document
  </button>
  <button id="detach" class="ctl detach" type="button" hidden>Remove</button>

  <output id="attached" class="attached" aria-live="polite"></output>
</div>

<!-- The two-tap report. Optional and dismissable by scope decision
     (docs/SCOPE.md section 1), so Skip is a real button of the same
     size and weight as the rest: a Skip that is smaller or greyer is a
     nudge, and section 2's carve-out rules out nudges. The wording asks
     what the owner REPORTS -- a dial is not an instrument for cognitive
     load, and section 3 makes any label implying otherwise a defect. -->
<section id="fx-panel" class="fx" aria-labelledby="fx-ask" hidden>
  <p id="fx-ask" class="fx-ask"></p>
  <div class="fx-row" role="group" aria-label="Reported load, 1 to 10">
    <span class="lbl">Load</span>
    <span id="fx-loads"></span>
  </div>
  <div class="fx-row" role="group" aria-label="Working mode, optional">
    <span class="lbl">Mode</span>
    <span id="fx-modes"></span>
    <button id="fx-nomode" class="ctl" type="button">No mode</button>
  </div>
  <div class="fx-row">
    <button id="fx-skip" class="ctl" type="button">Skip</button>
    <output id="fx-said" class="size" aria-live="polite"></output>
  </div>
</section>

<div class="modes" role="radiogroup" aria-label="Operating mode">
  <button class="mode" data-zone="GREEN"  role="radio" aria-checked="true" type="button">
    <span class="dot" aria-hidden="true"></span>Green<small>active</small>
  </button>
  <button class="mode" data-zone="YELLOW" role="radio" aria-checked="false" type="button">
    <span class="dot" aria-hidden="true"></span>Yellow<small>analytical</small>
  </button>
  <button class="mode" data-zone="RED"    role="radio" aria-checked="false" type="button">
    <span class="dot" aria-hidden="true"></span>Red<small>archival</small>
  </button>
</div>

<!-- The glyph keyboard. Keys TYPE INTO the message box below, the
     same box a hardware keyboard types into -- one input path, never
     two, so commands, the pipeline and dictation polish all see one
     kind of message. The sequence bar translates the chain as it is
     built, so a chain can be checked without consulting a legend. -->
<section id="kb-panel" class="kb" aria-label="Glyph keyboard" hidden>
  <div id="kb-rows" class="kb-rows"></div>
  <p class="kbd-lbl">Actions</p>
  <div id="kb-actions" class="kb-row"></div>
  <div class="kb-seq">
    <output id="kb-says" aria-live="polite"></output>
    <span class="spacer"></span>
    <button id="kb-type" class="ctl" type="button">Insert</button>
    <button id="kb-clear" class="ctl" type="button">Reset</button>
  </div>
</section>

<form id="composer" class="composer" autocomplete="off">
  <button id="kb-open" class="ctl" type="button" aria-expanded="false"
          aria-controls="kb-panel">Glyphs</button>
  <label class="sr" for="msg">Message</label>
  <textarea id="msg" rows="1" placeholder="Type a message, or press Speak…"></textarea>
  <button id="send" class="ctl send" type="submit">Send</button>
</form>

<script src="app.js"></script>
</body>
</html>
