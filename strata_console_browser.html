function kbHandleFile(file) {
  if (!file) return;
  const name = file.name;
  const ext = (name.lastIndexOf('.') >= 0 ? name.slice(name.lastIndexOf('.')) : '').toLowerCase();
  if (!TEXT_EXTS.includes(ext)) {
    note('🗂 Couldn\'t read ' + name + ' — the library reads text formats (' +
         TEXT_EXTS.join(' ') + ').', true);
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => note('🗂 Couldn\'t read ' + name + ' — the file did not open.', true);
  reader.onload = () => {
    let body = String(reader.result || '');
    if (ext === '.html' || ext === '.htm') {
      try {
        const doc = new DOMParser().parseFromString(body, 'text/html');
        body = (doc.body && doc.body.textContent) || '';
      } catch (e) { /* keep the raw text */ }
    }
    if (!body.trim()) {
      note('🗂 Couldn\'t read ' + name + ' — unsupported format or empty file.', true);
      return;
    }
    if (body.length > MAX_ATTACHMENT_CHARS) body = body.slice(0, MAX_ATTACHMENT_CHARS);
    kb.addDocument(name.replace(/\.[^.]+$/, ''), body);
    note('🗂 Added to the library: ' + name + '. It joins every search the assistant grounds in.');
    kbRender();
  };
  reader.readAsText(file);
}

/* ---------- avatar visualizer ------------------------------------------
 * Ported from React/Tailwind integration directions into the console's
 * own idiom. What the directions called hooks and JSX are here plain
 * variables, listeners and SVG strings — same drawing, no framework.
 * Every input is a REAL signal, not a demo slider:
 *   mode      — processing while a pod call is in flight; error for a
 *               few seconds after a pod failure; focus while there is
 *               recent typing/clicking; idle otherwise.
 *   load      — in-flight call + how many sources are ticked.
 *   activity  — rolling count of keystrokes and clicks (last 60 s).
 *   coherence — conversation recall depth + knowledge base depth.
 *   valence   — dips on errors, lifts with activity.
 *   glyphs    — the operator tokens in the newest message light their
 *               shapes on the avatar until the next message.
 * Colours are the console's measured hues, so the avatar lives in the
 * same visual world as the modes it reflects. Reduced motion: static. */

const AV_ZONE_HUE = { GREEN: '#4CAF50', YELLOW: '#FFC400', RED: '#F25430' };
const AV_MODE = {
  processing: { color: '#8FBEDA', speed: 2.4 },
  error:      { color: '#E09090', speed: 1.0 },
  focus:      { color: null,      speed: 1.4 },   // null: the zone's hue
  idle:       { color: '#9AA6B2', speed: 0.4 },
};

/* Spec 3: the Omega-1 overlay conditions the avatar too — flow
 * accelerates and brightens, safe mode settles and dims, crisis
 * compresses the field, dims every glyph but 🔺, and tints the whole
 * orb with the console's own soft-alarm hue. Transitions between
 * overlays INTERPOLATE: avFx eases toward the target a fraction per
 * tick (≈800 ms to settle at the 120 ms cadence — the spec's own
 * transition duration), so a mode change is a glide, never a jump.
 * Reduced motion snaps instantly and stays still, as everywhere else. */
const AV_OVERLAY_FX = {
  off:             { speed: 1.0, glow: 1.0,  glyphScale: 1.0,  compress: 1.0 },
  executive_focus: { speed: 1.3, glow: 1.1,  glyphScale: 1.05, compress: 1.0 },
  safe_mode:       { speed: 0.5, glow: 0.7,  glyphScale: 0.95, compress: 1.0 },
  flow_state:      { speed: 1.8, glow: 1.25, glyphScale: 1.1,  compress: 1.0 },
  reflection_mode: { speed: 0.7, glow: 0.9,  glyphScale: 1.0,  compress: 1.0 },
  crisis_triage:   { speed: 0.9, glow: 1.0,  glyphScale: 0.85, compress: 0.8,
                     color: '#E09090', focusGlyph: '🔺' },
};
let avFx = { speed: 1, glow: 1, glyphScale: 1, compress: 1 };

let avGlyphs = [];
let avErrorAt = 0;
let avEvents = [];
let avPhase = 0;
let avReduced = false;
try {
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  avReduced = mq.matches;
  mq.addEventListener('change', (e) => { avReduced = e.matches; });
} catch (e) { /* no preference readable — animate */ }

document.addEventListener('keydown', () => avEvents.push(Date.now()), true);
document.addEventListener('click', () => avEvents.push(Date.now()), true);

function avActivity() {
  const cut = Date.now() - 60000;
  avEvents = avEvents.filter((t) => t >= cut).slice(-200);
  return Math.min(1, avEvents.length / 60);
}

function avSetGlyphs(glyphs) { avGlyphs = (glyphs || []).slice(0, 4); }

function avMode() {
  if (busyCtl) return 'processing';
  if (Date.now() - avErrorAt < 8000) return 'error';
  if (avActivity() > 0.05) return 'focus';
  return 'idle';
}

function avMetrics() {
  const activity = avActivity();
  let load = busyCtl ? 0.45 : 0.1;
  if ($('src-web').checked) load += 0.15;
  if ($('src-drive').checked) load += 0.15;
  if ($('src-kb').checked) load += 0.1;
  if (attachment) load += 0.15;
  const coherence = Math.min(1,
    (store.recallTurns().length / 12) * 0.5 + (Math.min(kb.total(), 40) / 40) * 0.5);
  const valence = (Date.now() - avErrorAt < 8000)
    ? 0.25 : Math.min(1, 0.5 + activity * 0.35);
  return { coherence, load: Math.min(1, load), activity, valence };
}

/* Glyph → geometry, for the console's own lexicon. A glyph without a
   shape of its own shows as a dashed ring rather than vanishing. */
function avGlyphShape(g, color, glow) {
  const op = (0.45 + glow * 0.4).toFixed(2);
  const base = `fill="none" stroke="${color}" stroke-width="1.4" opacity="${op}"`;
  if (g === '🔺') return `<polygon points="50,16 84,82 16,82" ${base}/>`;
  if (g === '💠') return `<polygon points="50,22 72,50 50,78 28,50" ${base}/>`;
  if (g === '🔸') return `<polygon points="50,34 62,50 50,66 38,50" ${base}/>`;
  if (g === '⭕') return `<circle cx="50" cy="50" r="32" ${base}/>`;
  if (g === '⚪') return `<circle cx="50" cy="50" r="24" ${base}/>`;
  if (g === '🎯') return `<circle cx="50" cy="50" r="34" ${base}/><circle cx="50" cy="50" r="22" ${base}/>`;
  if (g === '🌊') {
    return `<path d="M 10 44 Q 22 30, 34 44 T 58 44 T 82 44" ${base}/>` +
           `<path d="M 18 60 Q 30 46, 42 60 T 66 60 T 90 60" ${base}/>`;
  }
  if (g === '🌀') return `<path d="M 12 50 Q 28 30, 50 50 T 88 50" ${base}/>`;
  if (g === '🧊') {
    const pts = [];
    for (let i = 0; i < 6; i += 1) {
      const a = (Math.PI / 3) * i - Math.PI / 2;
      pts.push((50 + 27 * Math.cos(a)).toFixed(1) + ',' + (50 + 27 * Math.sin(a)).toFixed(1));
    }
    return `<polygon points="${pts.join(' ')}" ${base}/>`;
  }
  if (g === '🔷') return `<polygon points="50,18 78,50 50,82 22,50" ${base}/>`;
  if (g === '⚡') return `<polyline points="56,14 38,52 52,52 42,86" ${base}/>`;
  if (g === '🐍') return `<path d="M 50 18 A 32 32 0 1 1 26 30" ${base}/>`;
  if (g === '🌳') return `<path d="M 50 84 L 50 44 M 50 64 L 32 46 M 50 58 L 68 40 M 50 44 L 50 24" ${base}/>`;
  if (g === '🔄') return `<path d="M 30 40 A 26 26 0 0 1 74 46" ${base}/><path d="M 70 60 A 26 26 0 0 1 26 54" ${base}/>`;
  if (g === '🔗') return `<circle cx="40" cy="50" r="16" ${base}/><circle cx="60" cy="50" r="16" ${base}/>`;
  if (g === '🤝') return `<circle cx="38" cy="50" r="20" ${base}/><circle cx="62" cy="50" r="20" ${base}/>`;
  if (g === '🔮') return `<circle cx="50" cy="50" r="30" ${base}/><path d="M 30 40 H 70 M 30 60 H 70 M 40 30 V 70 M 60 30 V 70" ${base}/>`;
  return `<circle cx="50" cy="50" r="36" stroke-dasharray="4 4" ${base}/>`;
}

function avDraw(svg, mode, m) {
  const conf = AV_MODE[mode] || AV_MODE.idle;
  const fxT = AV_OVERLAY_FX[overlayMode] || AV_OVERLAY_FX.off;
  const color = (fxT.color && overlayMode === 'crisis_triage')
    ? fxT.color
    : (conf.color || AV_ZONE_HUE[zone] || '#8FBEDA');
  const glow = Math.min(1, (0.2 + m.coherence * 0.8) * avFx.glow);
  const pulse = avReduced ? 1 : 1 + 0.12 * Math.sin(avPhase * 0.09 * conf.speed * avFx.speed);
  const r = (11 + m.load * 6) * pulse;
  const core = m.valence < 0.35 ? '#E09090' : (m.valence > 0.75 ? '#4CAF50' : '#8FBEDA');
  const cz = avFx.compress;
  let rings = '';
  for (let i = 0; i < 7; i += 1) {
    rings += `<circle cx="50" cy="50" r="${((8 + i * 6) * cz).toFixed(1)}" fill="none" stroke="rgba(220,228,238,0.06)" stroke-width="0.5"/>`;
  }
  let lines = '';
  for (let i = 0; i < 12; i += 1) {
    const a = (Math.PI * 2 * i) / 12;
    lines += `<line x1="50" y1="50" x2="${(50 + 44 * cz * Math.cos(a)).toFixed(1)}" y2="${(50 + 44 * cz * Math.sin(a)).toFixed(1)}" stroke="rgba(220,228,238,0.05)" stroke-width="0.3"/>`;
  }
  const spin = avReduced ? 0 : (avPhase * (0.2 + m.activity * 0.8) * conf.speed * avFx.speed) % 360;
  const glyphMarkup = avGlyphs.map((g) => {
    /* Crisis dims every glyph but the focus glyph — triage in pixels. */
    const gGlow = (fxT.focusGlyph && g !== fxT.focusGlyph) ? glow * 0.35 : glow;
    return avGlyphShape(g, color, gGlow);
  }).join('');
  svg.innerHTML =
    `<g transform="rotate(${spin.toFixed(1)} 50 50)">${rings}${lines}</g>` +
    `<circle cx="50" cy="50" r="${(r * 1.9).toFixed(1)}" fill="${color}" opacity="${(0.08 + glow * 0.14).toFixed(2)}"/>` +
    `<circle cx="50" cy="50" r="${r.toFixed(1)}" fill="none" stroke="${color}" stroke-width="1.6" opacity="${(0.35 + glow * 0.5).toFixed(2)}"/>` +
    `<circle cx="50" cy="50" r="${(r * 0.26).toFixed(1)}" fill="${core}"/>` +
    `<g transform="translate(50 50) scale(${avFx.glyphScale.toFixed(3)}) translate(-50 -50)">${glyphMarkup}</g>`;
}

function avStatsText(mode, m) {
  const pct = (v) => Math.round(v * 100) + '%';
  return 'Mode: <b>' + esc(mode) + (mode === 'focus' ? ' · ' + esc(zone) : '') + '</b><br>' +
    'Coherence: <b>' + pct(m.coherence) + '</b><br>' +
    'Load: <b>' + pct(m.load) + '</b><br>' +
    'Activity: <b>' + pct(m.activity) + '</b><br>' +
    'Valence: <b>' + pct(m.valence) + '</b>' +
    (avGlyphs.length ? '<br>Tokens: <b>' + esc(avGlyphs.join(' ')) + '</b>' : '') +
    (avReduced ? '<br>Reduced motion — static view' : '');
}

function avToggle(open) {
  const panel = $('av-panel');
  const want = (open === undefined) ? panel.hidden : !!open;
  panel.hidden = !want;
  $('avatar').setAttribute('aria-expanded', want ? 'true' : 'false');
  avTick();
}

function avTick() {
  avPhase += 1;
  /* Ease avFx toward the active overlay's targets: v += (t − v)·k is
     the classic exponential-approach lerp — ≈800 ms to settle at k=0.14
     and 120 ms ticks. Reduced motion snaps (k=1). */
  const fxT = AV_OVERLAY_FX[overlayMode] || AV_OVERLAY_FX.off;
  const k = avReduced ? 1 : 0.14;
  avFx.speed += (fxT.speed - avFx.speed) * k;
  avFx.glow += (fxT.glow - avFx.glow) * k;
  avFx.glyphScale += (fxT.glyphScale - avFx.glyphScale) * k;
  avFx.compress += (fxT.compress - avFx.compress) * k;
  const mode = avMode();
  const m = avMetrics();
  avDraw($('av-mini'), mode, m);
  $('avatar').setAttribute('aria-label', 'Avatar — console state: ' + mode);
  const panel = $('av-panel');
  if (!panel.hidden) {
    avDraw($('av-big'), mode, m);
    $('av-stats').innerHTML = avStatsText(mode, m);
  }
}
setInterval(avTick, avReduced ? 1000 : 120);

/* ---------- glyph keyboard ---------------------------------------------
 * The Phase-1 keyboard handoff, translated into this page's idiom. The
 * keys TYPE INTO the message box — one input path, never two — so the
 * whole pipeline (glyph classification, matrix conditioning, avatar
 * lighting) works on a tapped glyph exactly as on a typed one, with no
 * new machinery. The sequence bar mirrors the message as it is built:
 * the chain, its translation, and the grammar layer's verdict. Verdicts
 * are ADVISORY — a hint is never a gate, and Send remains the only
 * trigger; the handoff's auto-execute-on-chain-completion was declined
 * because an input device must never fire the send. */

/* EMPTY, on the owner's instruction (2026-10-17). The eighteen token
 * keys were removed so the keyboard can be refilled from scratch with a
 * vocabulary he is choosing. Deliberately an empty LIST rather than
 * deleted machinery: kbdKey, kbdTokens, the grammar layer and the
 * sequence bar are all still here and still tested, so refilling is a
 * data change -- add a bank below -- and not a rebuild.
 *
 * Shape of a bank, for when it is refilled:
 *     ['Bank label', ['KEY', 'KEY', ...]]
 * where each entry matches an identifier in GLYPHS. */
const KBD_BANKS = [];

/* The spec's number-row ten, kept exactly as filed — reached as
 * Alt+digit, because a bare digit must stay a digit while typing. */
/* Empty with the banks. A shortcut that types a key the keyboard no
 * longer shows would be a control acting on a vocabulary the owner
 * cannot see. */
const KBD_ALT_DIGITS = {};

const KBD_OPS = [
  ['→', 'then — sequential chain'],
  ['+', 'and — in parallel'],
  ['↔', 'mirror — balance two different glyphs'],
  ['within', 'nesting — A within B'],
  ['(', 'open a group'],
  [')', 'close a group'],
];
const KBD_OP_PAD = { 'within': ' within ', '→': ' → ', '+': ' + ',
                     '↔': ' ↔ ', '(': ' (', ')': ') ' };
const KBD_ACTION_OPENERS = ['🔺', '🔸', '💠', '🤝', '🥥'];

let kbdOpenState = false;

function kbdAltHint(glyph) {
  for (const [d, g] of Object.entries(KBD_ALT_DIGITS)) {
    if (g === glyph) return 'Alt+' + d;
  }
  return '';
}

function kbdRecentList() {
  const r = store.getState('kbd_recent', []);
  return Array.isArray(r) ? r.filter((g) => GLYPHS.some((x) => x.glyph === g)) : [];
}

function kbdRemember(glyph) {
  const r = kbdRecentList().filter((g) => g !== glyph);
  r.unshift(glyph);
  store.setState('kbd_recent', r.slice(0, 6));
}

/* Insert at the caret, keep focus in the box, keep the box growing —
 * exactly what typing the character would have done. */
function insertIntoMsg(text) {
  const b = $('msg');
  const s = b.selectionStart == null ? b.value.length : b.selectionStart;
  const e = b.selectionEnd == null ? b.value.length : b.selectionEnd;
  b.value = b.value.slice(0, s) + text + b.value.slice(e);
  const pos = s + text.length;
  b.focus();
  try { b.setSelectionRange(pos, pos); } catch (err) { /* box keeps the end */ }
  grow(b);
  kbdSeqUpdate();
}

/* Backspace that respects surrogate pairs — deleting half an emoji
 * leaves mojibake, so the last CODE POINT goes, not the last unit. */
function kbdBackspace() {
  const b = $('msg');
  let s = b.selectionStart == null ? b.value.length : b.selectionStart;
  const e = b.selectionEnd == null ? b.value.length : b.selectionEnd;
  if (s === e && s > 0) {
    const head = Array.from(b.value.slice(0, s));
    head.pop();
    const kept = head.join('');
    b.value = kept + b.value.slice(s);
    s = kept.length;
  } else if (e > s) {
    b.value = b.value.slice(0, s) + b.value.slice(e);
  }
  b.focus();
  try { b.setSelectionRange(s, s); } catch (err) { /* box keeps the end */ }
  grow(b);
  kbdSeqUpdate();
}

function tokenOf(glyph) {
  /* The text a key types. A written token survives copy-paste, search,
     a screen reader and a plain-text export; an emoji survives none of
     them reliably. */
  const g = GLYPHS.find((x) => x.glyph === glyph);
  return g ? '[' + g.name.replace(/_/g, ' ') + ']' : glyph;
}

function kbdPress(glyph) {
  kbdRemember(glyph);
  insertIntoMsg(tokenOf(glyph));
  if (kbdOpenState) kbdRender();   // the Recent row updates
}

function kbdLabelEl(text) {
  const d = document.createElement('div');
  d.className = 'kbd-lbl';
  d.textContent = text;
  return d;
}

function kbdKey(glyph) {
  const g = GLYPHS.find((x) => x.glyph === glyph);
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'kbd-key';
  const name = g ? g.name.replace(/_/g, ' ') : glyph;
  /* Names, not pictures (2026-10-17, owner's instruction). The emoji
     were too easy for a person and a language model to read
     differently; a written name cannot be misread. The glyph character
     remains the INTERNAL identity, so stored cards, the interaction
     matrix and the avatar are untouched -- nothing is shown, and
     nothing already saved is broken. */
  b.innerHTML = '<span class="kn-big">' + esc(name) + '</span>';
  b.setAttribute('aria-label', name + ' token');
  let title = name + (g && g.fn ? ' — ' + g.fn : '');
  if (g && g.zone) title += ' · zone ' + g.zone;
  if (g && g.load) title += ' · load ' + g.load[0] + '–' + g.load[1];
  if (g && g.instr) title += '\n' + g.instr;
  const alt = kbdAltHint(glyph);
  if (alt) title += '\n' + alt + ' types it from anywhere.';
  /* The load dial informs, never locks (Phase 1B feature 7, honest
     form): a glyph whose load range starts above the dial dims but
     stays fully usable. */
  if (g && g.load && g.load[0] > cogLoad) {
    b.classList.add('dim');
    title += '\nDimmed: its load range starts above your load dial (' +
             cogLoad + '/10). Still usable — dimming is information, not a lock.';
  }
  b.title = title;
  b.addEventListener('click', () => kbdPress(glyph));
  return b;
}

function kbdOpKey(sym, hint) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'kbd-key op';
  b.innerHTML = '<span class="kg" aria-hidden="true">' + esc(sym) + '</span>';
  b.setAttribute('aria-label', hint);
  b.title = sym + ' — ' + hint;
  b.addEventListener('click', () => insertIntoMsg(KBD_OP_PAD[sym] || sym));
  return b;
}

function kbdUtilKey(sym, label, fn) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'kbd-key op';
  b.innerHTML = '<span class="kg" aria-hidden="true">' + esc(sym) + '</span>' +
                '<span class="kn">' + esc(label) + '</span>';
  b.setAttribute('aria-label', label);
  b.title = label;
  b.addEventListener('click', fn);
  return b;
}

function kbdRender() {
  const panel = $('kbd-panel');
  if (!panel || panel.hidden) return;
  panel.innerHTML = '';

  /* No vocabulary yet. Say so plainly and stop -- an empty panel with no
     explanation reads as a control that failed to load, which is the
     defect this shop names first. */
  if (!KBD_BANKS.length) {
    const empty = document.createElement('p');
    empty.className = 'kbd-empty';
    empty.textContent = 'The keyboard is empty. The previous token set was '
      + 'removed on 2026-10-17 and a new one has not been added yet — '
      + 'until it is, type into the message box as normal.';
    panel.appendChild(empty);
    return;
  }

  const rows = document.createElement('div');
  rows.className = 'kbd-rows';
  const recent = kbdRecentList();
  if (recent.length) {
    rows.appendChild(kbdLabelEl('Recent'));
    const r = document.createElement('div');
    r.className = 'kbd-row';
    recent.forEach((g) => r.appendChild(kbdKey(g)));
    rows.appendChild(r);
  }
  KBD_BANKS.forEach(([label, glyphs]) => {
    rows.appendChild(kbdLabelEl(label));
    const r = document.createElement('div');
    r.className = 'kbd-row';
    glyphs.forEach((g) => r.appendChild(kbdKey(g)));
    rows.appendChild(r);
  });
  rows.appendChild(kbdLabelEl('Operators'));
  const opRow = document.createElement('div');
  opRow.className = 'kbd-row';
  KBD_OPS.forEach(([sym, hint]) => opRow.appendChild(kbdOpKey(sym, hint)));
  opRow.appendChild(kbdUtilKey('␣', 'Space', () => insertIntoMsg(' ')));
  opRow.appendChild(kbdUtilKey('⌫', 'Backspace', kbdBackspace));
  rows.appendChild(opRow);
  panel.appendChild(rows);
  const seq = document.createElement('div');
  seq.className = 'kbd-seq';
  seq.id = 'kbd-seq';
  panel.appendChild(seq);
  kbdSeqUpdate();
}

/* Tokenize the message the way the grammar layer reads it: glyphs and
 * the three chain operators, in order; everything else is prose and
 * passes through untouched. */
function kbdTokens(text) {
  /* Reads BOTH spellings in one left-to-right pass: the written token
     the keyboard now types, and the retired emoji a stored card or an
     old message may still carry. Longest match wins, so [GOLDEN SOURCE]
     is never read as [GOLDEN] plus prose. */
  const byChar = new Map(GLYPHS.map((g) => [g.glyph, g]));
  const byToken = GLYPHS
    .map((g) => [Array.from(tokenOf(g.glyph).toUpperCase()), g])
    .sort((a, b) => b[0].length - a[0].length);
  const ops = new Set(['→', '↔', '+']);
  /* Array.from, not src[i]: an emoji is a surrogate PAIR, and indexing a
     string by number splits it in half -- which silently stopped the
     retired pictures being recognised at all. Code points, always. */
  const chars = Array.from(String(text || ''));
  const upper = chars.map((c) => c.toUpperCase());
  const out = [];
  let i = 0;
  while (i < chars.length) {
    let matched = false;
    for (const [tok, g] of byToken) {
      if (tok.every((tc, k) => upper[i + k] === tc)) {
        out.push({ glyph: g });
        i += tok.length;
        matched = true;
        break;
      }
    }
    if (matched) continue;
    const ch = chars[i];
    if (byChar.has(ch)) out.push({ glyph: byChar.get(ch) });
    else if (ops.has(ch)) out.push({ op: ch });
    i += 1;
  }
  return out;
}

/* The grammar layer's rules (H9), as ADVICE: chains open with an action
 * glyph, cap at seven, no doubled glyphs, ↔ pairs exactly two distinct
 * glyphs. Never a gate — the verdict informs, the user decides. */
function kbdVerdict(tokens) {
  const glyphs = tokens.filter((t) => t.glyph);
  const notes = [];
  if (glyphs.length > 7) notes.push('over 7 tokens — the grammar caps a chain at seven');
  for (let i = 1; i < tokens.length; i += 1) {
    if (tokens[i].glyph && tokens[i - 1].glyph &&
        tokens[i].glyph.glyph === tokens[i - 1].glyph.glyph) {
      notes.push('a token repeats back-to-back — the grammar reads that as a stutter');
      break;
    }
  }
  tokens.forEach((t, i) => {
    if (t.op !== '↔') return;
    const a = tokens[i - 1], b = tokens[i + 1];
    if (!a || !b || !a.glyph || !b.glyph) notes.push('↔ pairs exactly two tokens, one on each side');
    else if (a.glyph.glyph === b.glyph.glyph) notes.push('↔ balances two DIFFERENT tokens');
  });
  if (glyphs.length >= 2 && !KBD_ACTION_OPENERS.includes(glyphs[0].glyph.glyph)) {
    notes.push('chains usually open with an action token (' +
      KBD_ACTION_OPENERS.map(tokenOf).join(' ') + ')');
  }
  const unique = [...new Set(notes)];
  return { ok: !unique.length, notes: unique };
}

function kbdSeqUpdate() {
  const el = $('kbd-seq');
  if (!el || !kbdOpenState) return;
  const tokens = kbdTokens($('msg').value);
  if (!tokens.some((t) => t.glyph)) {
    el.innerHTML = '<span class="trans">Tap tokens to build a chain — the sequence bar ' +
      'translates it here and checks it against the grammar. Advisory only: ' +
      'a hint is never a gate.</span>';
    return;
  }
  const chain = tokens.map((t) => (t.glyph ? tokenOf(t.glyph.glyph) : t.op)).join(' ');
  const trans = tokens.map((t) => (t.glyph ? t.glyph.name.replace(/_/g, ' ') : t.op)).join(' ');
  const v = kbdVerdict(tokens);
  el.innerHTML =
    '<span class="chain">' + esc(chain) + '</span>' +
    '<span class="trans">' + esc(trans) + '</span>' +
    (v.ok ? '<span class="ok">✓ reads clean</span>'
          : '<span class="warn">' + esc(v.notes.join(' · ')) + '</span>');
}

function kbdToggle(open) {
  kbdOpenState = (open === undefined) ? !kbdOpenState : !!open;
  const panel = $('kbd-panel');
  panel.hidden = !kbdOpenState;
  $('kbd-open').setAttribute('aria-expanded', kbdOpenState ? 'true' : 'false');
  if (kbdOpenState) kbdRender();
}

/* ---------- Strata Sheets ----------------------------------------------
 * A working spreadsheet, in the console's own idiom — no framework, no
 * library, and honestly scoped: the LibreOffice-class suite cannot live
 * inside a single self-contained page, but the 20% of a spreadsheet
 * that covers 80% of real use can. Cells run A1–Z200, the SAME
 * coordinate grammar as the knowledge base's A1 filing system. A cell
 * holds a number, text, or a formula starting with '=' — arithmetic,
 * cell refs, ranges inside functions, and SUM, AVERAGE (AVG), COUNT,
 * MIN, MAX, ROUND, ABS.
 *
 * The engine is the classic three-stage kernel, small enough to read:
 *   1. TOKENIZE  — the formula string becomes tokens (numbers, refs,
 *      operators, function names);
 *   2. PARSE     — a recursive-descent parser walks the tokens with
 *      correct precedence (* / bind tighter than + -, parens override);
 *   3. EVALUATE  — cell references recurse into other cells, memoized
 *      so each cell computes once, with a visiting set that turns
 *      A1→B1→A1 loops into an honest #CYCLE instead of a hang.
 * Errors are values, not crashes: #ERROR (bad syntax), #VALUE (text
 * where a number belongs), #REF (outside the grid), #CYCLE, #DIV/0.
 *
 * Storage: its own key (strata_sheets_v1), fully separate from the
 * conversation stores and the KB — none of the three can touch the
 * others. localStorage is a few MB, so this is honest about being a
 * personal sheet, not a data warehouse; CSV carries data in and out
 * (⧉ copies computed values; ⬇ downloads a .csv that Excel, Google
 * Sheets and LibreOffice all open — the human-is-the-bridge pattern,
 * again). The pod assistant reads and writes sheets only through the
 * page-defined tools below: applied locally, logged, reported. */

function shColLetter(i) { return String.fromCharCode(65 + i); }

function shParseRef(t) {
  const m = /^([A-Z])([0-9]{1,3})$/.exec(String(t || ''));
  if (!m) return null;
  const r = parseInt(m[2], 10) - 1;
  if (r < 0) return null;
  return { c: m[1].charCodeAt(0) - 65, r: r, addr: m[1] + m[2] };
}

const sheets = (() => {
  const KEY = 'strata_sheets_v1';
  const MAX_ROWS = 200, MAX_COLS = 26;
  const blank = () => ({ list: [], activeId: '' });
  let data = blank();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) data = Object.assign(blank(), JSON.parse(raw));
  } catch (e) { data = blank(); }
  if (!Array.isArray(data.list)) data.list = [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* memory-only */ } };
  const uid = () => 's-' + Math.random().toString(36).slice(2, 8) + '-' + Date.now().toString(36);
  return {
    get data() { return data; },
    MAX_ROWS: MAX_ROWS, MAX_COLS: MAX_COLS,
    active() { return data.list.find((s) => s.id === data.activeId) || data.list[0] || null; },
    byName(name) {
      const low = String(name || '').trim().toLowerCase();
      return low ? data.list.find((s) => s.name.toLowerCase() === low) : null;
    },
    create(name) {
      const s = { id: uid(),
                  name: String(name || 'Sheet ' + (data.list.length + 1)).trim().slice(0, 60) || 'Sheet',
                  rows: 20, cols: 8, cells: {} };
      data.list.push(s);
      data.activeId = s.id;
      save();
      return s;
    },
    setActive(id) { if (data.list.some((x) => x.id === id)) { data.activeId = id; save(); } },
    rename(id, name) {
      const s = data.list.find((x) => x.id === id);
      if (s && String(name || '').trim()) { s.name = String(name).trim().slice(0, 60); save(); }
    },
    remove(id) {
      const i = data.list.findIndex((x) => x.id === id);
      if (i < 0) return;
      data.list.splice(i, 1);
      if (data.activeId === id) data.activeId = data.list[0] ? data.list[0].id : '';
      save();
    },
    setCell(s, addr, raw) {
      const v = String(raw === undefined || raw === null ? '' : raw);
      if (v === '') delete s.cells[addr]; else s.cells[addr] = v;
      save();
    },
    addRow(s) { if (s.rows >= MAX_ROWS) return false; s.rows += 1; save(); return true; },
    addCol(s) { if (s.cols >= MAX_COLS) return false; s.cols += 1; save(); return true; },
    growTo(s, rows, cols) {
      s.rows = Math.max(s.rows, Math.min(rows, MAX_ROWS));
      s.cols = Math.max(s.cols, Math.min(cols, MAX_COLS));
      save();
    },
    importGrid(s, grid) {
      s.cells = {};
      let cells = 0, clipped = false;
      grid.forEach((row, r) => {
        if (r >= MAX_ROWS) { clipped = true; return; }
        row.forEach((val, c) => {
          if (c >= MAX_COLS) { clipped = true; return; }
          const v = String(val);
          if (v !== '') { s.cells[shColLetter(c) + (r + 1)] = v; cells += 1; }
        });
      });
      s.rows = Math.max(20, Math.min(MAX_ROWS, grid.length));
      s.cols = Math.max(8, Math.min(MAX_COLS, grid.reduce((m, row) => Math.max(m, row.length), 1)));
      save();
      return { cells: cells, clipped: clipped };
    },
  };
})();

/* Stage 1: the tokenizer. Order matters — numbers before words, so
 * "3" never gets swallowed by a ref, and refs/function names are both
 * just 'word' tokens the parser tells apart by what follows. */
function shTokenize(src) {
  const s = String(src).toUpperCase();
  const toks = [];
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (ch === ' ' || ch === '\t') { i += 1; continue; }
    if ('+-*/(),:'.includes(ch)) { toks.push({ t: ch }); i += 1; continue; }
    let m = /^[0-9]*\.?[0-9]+/.exec(s.slice(i));
    if (m && m[0]) { toks.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue; }
    m = /^[A-Z][A-Z0-9]*/.exec(s.slice(i));
    if (m) { toks.push({ t: 'word', v: m[0] }); i += m[0].length; continue; }
    throw { code: '#ERROR' };
  }
  return toks;
}

function shApplyFunc(name, args) {
  const toNum = (v) => {
    if (v === '' || v === undefined || v === null) return 0;
    if (typeof v === 'number') return v;
    throw { code: '#VALUE' };
  };
  const nums = args.filter((v) => typeof v === 'number');
  switch (name) {
    case 'SUM': return nums.reduce((a, b) => a + b, 0);
    case 'AVERAGE':
      if (!nums.length) throw { code: '#DIV/0' };
      return nums.reduce((a, b) => a + b, 0) / nums.length;
    case 'COUNT': return nums.length;
    case 'MIN': return nums.length ? Math.min.apply(null, nums) : 0;
    case 'MAX': return nums.length ? Math.max.apply(null, nums) : 0;
    case 'ROUND': {
      const x = toNum(args[0]);
      const d = args.length > 1 ? toNum(args[1]) : 0;
      const f = Math.pow(10, Math.max(-10, Math.min(10, Math.trunc(d))));
      return Math.round(x * f) / f;
    }
    case 'ABS': return Math.abs(toNum(args[0]));
    default: throw { code: '#NAME?' };
  }
}

/* Stages 2 and 3 together: a recursive-descent parser that evaluates
 * as it goes. cellValue() is handed in by shEvaluate, so a ref recurses
 * into the other cell's own evaluation. */
function shEvalFormula(src, sheet, cellValue) {
  const toks = shTokenize(src);

  /* A formula that is exactly one cell ref passes the value through
     untouched — text included — so =A1 mirrors A1 faithfully. */
  if (toks.length === 1 && toks[0].t === 'word' && shParseRef(toks[0].v)) {
    const a = shParseRef(toks[0].v);
    if (a.r >= sheet.rows || a.c >= sheet.cols) throw { code: '#REF' };
    return cellValue(a.addr);
  }

  let p = 0;
  const peek = () => toks[p];
  const eat = (t) => { if (!toks[p] || toks[p].t !== t) throw { code: '#ERROR' }; return toks[p++]; };
  const toNum = (v) => {
    if (v === '' || v === undefined || v === null) return 0;
    if (typeof v === 'number') return v;
    throw { code: '#VALUE' };
  };

  function refValues(tok) {
    const a = shParseRef(tok.v);
    if (!a) throw { code: '#NAME?' };
    if (peek() && peek().t === ':') {
      p += 1;
      const b = shParseRef(eat('word').v);
      if (!b) throw { code: '#ERROR' };
      const vals = [];
      for (let r = Math.min(a.r, b.r); r <= Math.max(a.r, b.r); r += 1) {
        for (let c = Math.min(a.c, b.c); c <= Math.max(a.c, b.c); c += 1) {
          if (r >= sheet.rows || c >= sheet.cols) throw { code: '#REF' };
          vals.push(cellValue(shColLetter(c) + (r + 1)));
        }
      }
      return vals;
    }
    if (a.r >= sheet.rows || a.c >= sheet.cols) throw { code: '#REF' };
    return [cellValue(a.addr)];
  }

  function factor() {
    const t = peek();
    if (!t) throw { code: '#ERROR' };
    if (t.t === 'num') { p += 1; return t.v; }
    if (t.t === '-') { p += 1; return -toNum(factor()); }
    if (t.t === '(') { p += 1; const v = expr(); eat(')'); return v; }
    if (t.t === 'word') {
      p += 1;
      if (peek() && peek().t === '(') {
        p += 1;   // a function call
        const name = t.v === 'AVG' ? 'AVERAGE' : t.v;
        const args = [];
        if (peek() && peek().t !== ')') {
          for (;;) {
            const at = peek();
            /* A range like A1:A5 is only meaningful inside a function
               argument, so it is recognized here and expanded. */
            if (at && at.t === 'word' && shParseRef(at.v) &&
                toks[p + 1] && toks[p + 1].t === ':') {
              p += 1;
              refValues(at).forEach((v) => args.push(v));
            } else {
              args.push(expr());
            }
            if (peek() && peek().t === ',') { p += 1; continue; }
            break;
          }
        }
        eat(')');
        return shApplyFunc(name, args);
      }
      const vals = refValues(t);
      if (vals.length !== 1) throw { code: '#ERROR' };
      return toNum(vals[0]);
    }
    throw { code: '#ERROR' };
  }
  function term() {
    let v = toNum(factor());
    while (peek() && (peek().t === '*' || peek().t === '/')) {
      const op = toks[p++].t;
      const w = toNum(factor());
      v = op === '*' ? v * w : v / w;
    }
    return v;
  }
  function expr() {
    let v = term();
    while (peek() && (peek().t === '+' || peek().t === '-')) {
      const op = toks[p++].t;
      const w = term();
      v = op === '+' ? v + w : v - w;
    }
    return v;
  }

  const v = expr();
  if (p !== toks.length) throw { code: '#ERROR' };
  if (typeof v === 'number' && !isFinite(v)) throw { code: '#DIV/0' };
  return v;
}

/* Evaluate the whole sheet: every cell once (memoized), cycles caught,
 * errors recorded as values. Full recompute per change — at 26×200 the
 * grid is small enough that correctness beats cleverness. */
function shEvaluate(sheet) {
  const out = {};
  const visiting = new Set();
  function cellValue(addr) {
    if (out[addr]) {
      if (out[addr].err) throw { code: out[addr].err };
      return out[addr].v;
    }
    if (visiting.has(addr)) throw { code: '#CYCLE' };
    visiting.add(addr);
    let res;
    try {
      const raw = sheet.cells[addr];
      if (raw === undefined || raw === '') {
        res = { v: '' };
      } else if (String(raw).charAt(0) === '=') {
        res = { v: shEvalFormula(String(raw).slice(1), sheet, cellValue) };
      } else {
        const n = Number(raw);
        res = (String(raw).trim() !== '' && isFinite(n)) ? { v: n } : { v: String(raw) };
      }
    } catch (e) {
      res = { v: '', err: (e && e.code) || '#ERROR' };
    }
    visiting.delete(addr);
    out[addr] = res;
    if (res.err) throw { code: res.err };
    return res.v;
  }
  for (let r = 0; r < sheet.rows; r += 1) {
    for (let c = 0; c < sheet.cols; c += 1) {
      try { cellValue(shColLetter(c) + (r + 1)); } catch (e) { /* recorded in out */ }
    }
  }
  return out;
}

function shDisplay(res) {
  if (!res) return '';
  if (res.err) return res.err;
  if (typeof res.v === 'number') return String(Math.round(res.v * 1e10) / 1e10);
  return String(res.v);
}

function shToCSV(sheet) {
  const out = shEvaluate(sheet);
  const rows = [];
  for (let r = 0; r < sheet.rows; r += 1) {
    const row = [];
    for (let c = 0; c < sheet.cols; c += 1) {
      const d = shDisplay(out[shColLetter(c) + (r + 1)]);
      row.push(/[",\n]/.test(d) ? '"' + d.replace(/"/g, '""') + '"' : d);
    }
    rows.push(row.join(','));
  }
  while (rows.length && /^,*$/.test(rows[rows.length - 1])) rows.pop();
  return rows.join('\n');
}

/* CSV/TSV in: a small state machine that honors quoted fields. The
 * delimiter is sniffed from the first line — a paste from Google
 * Sheets or Excel arrives tab-separated, a .csv file comma-separated. */
function shParseCSV(text) {
  const src = String(text || '').replace(/\r\n?/g, '\n');
  if (!src.trim()) return [];
  const delim = src.split('\n')[0].includes('\t') ? '\t' : ',';
  const rows = [[]];
  let cur = '';
  let inQ = false;
  for (let i = 0; i < src.length; i += 1) {
    const ch = src[i];
    if (inQ) {
      if (ch === '"') {
        if (src[i + 1] === '"') { cur += '"'; i += 1; } else inQ = false;
      } else cur += ch;
    } else if (ch === '"' && cur === '') {
      inQ = true;
    } else if (ch === delim) {
      rows[rows.length - 1].push(cur); cur = '';
    } else if (ch === '\n') {
      rows[rows.length - 1].push(cur); cur = '';
      rows.push([]);
    } else cur += ch;
  }
  rows[rows.length - 1].push(cur);
  while (rows.length && rows[rows.length - 1].every((c) => c === '')) rows.pop();
  return rows;
}

/* ---------- sheets UI -------------------------------------------------- */

let shOpenState = false;
let shImportOpen = false;
let shSelected = 'A1';
let shInputs = {};

function shBadge() {
  const btn = $('sheet-open');
  if (!btn) return;
  const n = sheets.data.list.length;
  btn.innerHTML = '<span aria-hidden="true">📊</span> Sheets' + (n ? ' (' + n + ')' : '');
}

function shExportCSV() {
  const s = sheets.active();
  if (!s) { note('📊 No sheet yet — open 📊 Sheets and start typing.', true); return; }
  const csv = shToCSV(s);
  copyText(csv).then((ok) => {
    note(ok
      ? '⧉ ' + s.name + ' exported — ' + csv.length.toLocaleString() +
        ' characters of CSV on the clipboard (computed values; the formulas stay in the sheet).'
      : '⧉ The browser refused clipboard access — the export did not happen.', !ok);
  });
}

async function shDownload(s) {
  const csv = shToCSV(s);
  const fname = (s.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'sheet') + '.csv';
  await dlsReady;
  if (dls) {
    /* The artifact viewer's save surface: the viewer sees the filename
       and size and confirms — a save is never silent, and a "no" is an
       answer, not an error. */
    try {
      await dls.save({ filename: fname, data: csv });
      note('⬇ ' + fname + ' saved — Excel, Google Sheets and LibreOffice all open it. ' +
           'The formulas stay in the sheet; the file carries computed values.');
    } catch (e) {
      const code = (e && e.code) || 'unavailable';
      if (code === 'declined') note('⬇ Save declined — nothing was written.');
      else if (code === 'rate_limited') note('⬇ A save prompt is already open — try again in a moment.', true);
      else note('⬇ Saving a file is not available in this view (' + code + ') — ' +
                '⧉ CSV to the clipboard works everywhere.', true);
    }
    return;
  }
  /* Outside the artifact viewer (the page opened as a plain file), the
     classic anchor download still works — try it, and say so honestly. */
  try {
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch (e) { /* done */ } }, 5000);
    note('⬇ ' + fname + ' offered for download. If no file appeared, this view ' +
         'blocks downloads — ⧉ CSV to the clipboard always works.');
  } catch (e) {
    note('⬇ The download could not start here — use ⧉ CSV instead.', true);
  }
}

function shCommit(addr, raw) {
  const s = sheets.active();
  if (!s) return;
  if ((s.cells[addr] || '') !== String(raw)) sheets.setCell(s, addr, raw);
  shRefresh();
}

/* Repaint computed values into the existing inputs — no rebuild, and
 * the cell being edited is left alone (it is showing its raw source). */
function shRefresh() {
  const s = sheets.active();
  if (!s) return;
  const out = shEvaluate(s);
  Object.entries(shInputs).forEach(([addr, inp]) => {
    if (document.activeElement === inp) return;
    const res = out[addr];
    inp.value = shDisplay(res);
    inp.classList.toggle('numeric', !!res && !res.err && typeof res.v === 'number');
    inp.classList.toggle('err', !!res && !!res.err);
    inp.title = res && res.err
      ? addr + ' — ' + res.err + (s.cells[addr] ? ' · source: ' + s.cells[addr] : '')
      : (s.cells[addr] && String(s.cells[addr]).charAt(0) === '='
          ? addr + ' = ' + s.cells[addr] : addr);
  });
}

function shRender() {
  shBadge();
  const panel = $('sheet-panel');
  if (!panel || panel.hidden) return;
  let s = sheets.active();
  if (!s) s = sheets.create('Sheet 1');
  panel.innerHTML = '';
  shInputs = {};

  const bar = kbEl('div', 'sh-bar');
  const pick = document.createElement('select');
  pick.setAttribute('aria-label', 'Choose sheet');
  sheets.data.list.forEach((x) => {
    const o = document.createElement('option');
    o.value = x.id;
    o.textContent = x.name;
    if (x.id === s.id) o.selected = true;
    pick.appendChild(o);
  });
  pick.addEventListener('change', () => { sheets.setActive(pick.value); shSelected = 'A1'; shRender(); });
  bar.appendChild(pick);
  const nameIn = document.createElement('input');
  nameIn.type = 'text';
  nameIn.value = s.name;
  nameIn.style.width = '14ch';
  nameIn.setAttribute('aria-label', 'Rename this sheet');
  nameIn.title = 'Sheet name — edit and press Enter to rename.';
  nameIn.addEventListener('change', () => { sheets.rename(s.id, nameIn.value); shRender(); });
  bar.appendChild(nameIn);
  bar.appendChild(kbBtn('＋ Sheet', () => { sheets.create(); shSelected = 'A1'; shRender(); }));
  bar.appendChild(kbBtn('＋ Row', () => {
    if (!sheets.addRow(s)) note('📊 Row cap reached (' + sheets.MAX_ROWS + ') — a personal sheet, not a data warehouse.', true);
    shRender();
  }));
  bar.appendChild(kbBtn('＋ Column', () => {
    if (!sheets.addCol(s)) note('📊 Column cap reached (Z) — the grid shares the KB\'s A–Z grammar.', true);
    shRender();
  }));
  bar.appendChild(kbBtn('⧉ CSV', shExportCSV));
  bar.appendChild(kbBtn('⬇ .csv', () => shDownload(s)));
  bar.appendChild(kbBtn('📋 Import', () => { shImportOpen = !shImportOpen; shRender(); }));
  bar.appendChild(kbBtn('Delete sheet', () => {
    const gone = s.name;
    sheets.remove(s.id);
    note('📊 Sheet deleted: ' + gone + '.');
    shSelected = 'A1';
    shRender();
  }));
  panel.appendChild(bar);

  if (shImportOpen) {
    const imp = kbEl('div', 'kb-form');
    imp.innerHTML =
      '<label for="sh-import-text">Paste rows — CSV, or tab-separated straight from Google Sheets / Excel. ' +
      'Importing fills this sheet from A1 and replaces what is in it.</label>' +
      '<textarea id="sh-import-text"></textarea>';
    const r = kbEl('div', 'kb-row');
    r.appendChild(kbBtn('Import into this sheet', () => {
      const grid = shParseCSV($('sh-import-text').value);
      if (!grid.length) { note('📊 Nothing to import — paste rows first.', true); return; }
      const res = sheets.importGrid(s, grid);
      note('📊 Imported ' + res.cells + ' cell(s) into ' + s.name +
           (res.clipped ? ' — clipped at ' + sheets.MAX_COLS + ' columns × ' + sheets.MAX_ROWS + ' rows.' : '.'));
      shImportOpen = false;
      shRender();
    }));
    imp.appendChild(r);
    panel.appendChild(imp);
  }

  const fx = kbEl('div', 'sh-fx');
  const addrEl = kbEl('span', 'sh-addr');
  addrEl.id = 'sh-addr';
  addrEl.textContent = shSelected;
  fx.appendChild(addrEl);
  const fxIn = document.createElement('input');
  fxIn.id = 'sh-fx-in';
  fxIn.type = 'text';
  fxIn.setAttribute('aria-label', 'Formula bar — edits the selected cell');
  fxIn.placeholder = 'Selected cell — a number, text, or a formula starting with =';
  fxIn.value = s.cells[shSelected] || '';
  fxIn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      shCommit(shSelected, fxIn.value);
      const inp = shInputs[shSelected];
      if (inp) inp.focus();
    }
  });
  fxIn.addEventListener('change', () => shCommit(shSelected, fxIn.value));
  fx.appendChild(fxIn);
  panel.appendChild(fx);

  const table = document.createElement('table');
  table.className = 'sh-grid';
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  hr.appendChild(kbEl('th', 'rowh', ''));
  for (let c = 0; c < s.cols; c += 1) hr.appendChild(kbEl('th', '', esc(shColLetter(c))));
  thead.appendChild(hr);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  for (let r = 0; r < s.rows; r += 1) {
    const tr = document.createElement('tr');
    tr.appendChild(kbEl('th', 'rowh', String(r + 1)));
    for (let c = 0; c < s.cols; c += 1) {
      const addr = shColLetter(c) + (r + 1);
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.setAttribute('aria-label', 'Cell ' + addr);
      inp.addEventListener('focus', () => {
        shSelected = addr;
        addrEl.textContent = addr;
        const raw = s.cells[addr] || '';
        inp.value = raw;              // edit the SOURCE, see the value on blur
        inp.classList.remove('numeric', 'err');
        fxIn.value = raw;
      });
      inp.addEventListener('input', () => { fxIn.value = inp.value; });
      inp.addEventListener('blur', () => shCommit(addr, inp.value));
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const below = shInputs[shColLetter(c) + (r + 2)];
          if (below) below.focus(); else inp.blur();
        } else if (e.key === 'Escape') {
          inp.value = s.cells[addr] || '';
          fxIn.value = inp.value;
        }
      });
      shInputs[addr] = inp;
      td.appendChild(inp);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  panel.appendChild(table);

  const hint = kbEl('div', 'sh-hint',
    'Formulas start with <code>=</code> — try <code>=SUM(A1:A5)</code>, ' +
    '<code>=AVERAGE(B1:B10)</code>, <code>=A1*1.0825</code>, <code>=ROUND(C3, 2)</code>. ' +
    'Enter moves down, Tab moves right, Escape restores a cell. ' +
    'Errors are named, never silent: #ERROR, #VALUE, #REF, #CYCLE, #DIV/0.');
  panel.appendChild(hint);

  shRefresh();
}

function shToggle(open) {
  shOpenState = (open === undefined) ? !shOpenState : !!open;
  const panel = $('sheet-panel');
  panel.hidden = !shOpenState;
  $('sheet-open').setAttribute('aria-expanded', shOpenState ? 'true' : 'false');
  if (shOpenState) shRender(); else shBadge();
}

/* Tools the pod assistant may call for the sheets — same contract as
 * the KB tools: each executes HERE, on this browser's stores, and
 * pushes a plain-language record so the turn reports what was done. */
function sheetAssistantTools(actions) {
  return [
    { name: 'readSheet',
      description: "Read one of the user's Strata Sheets (small spreadsheets in this console). Returns the sheet's computed values as CSV, its raw formulas by cell, and the list of all sheet names. Omit name for the active sheet. Call it before answering any question about the user's sheet data.",
      inputSchema: { type: 'object',
        properties: { name: { type: 'string', description: 'sheet name; omit for the active sheet' } } },
      execute: (a) => {
        const names = sheets.data.list.map((x) => x.name);
        const s = (a && a.name) ? sheets.byName(a.name) : sheets.active();
        if (!s) return { sheets: names, note: names.length ? 'No sheet by that name.' : 'No sheets exist yet.' };
        const formulas = {};
        Object.entries(s.cells).forEach(([k, v]) => {
          if (String(v).charAt(0) === '=') formulas[k] = v;
        });
        return { name: s.name, rows: s.rows, cols: s.cols, csv: shToCSV(s),
                 formulas: formulas, sheets: names };
      } },
    { name: 'setSheetCells',
      description: "Write cells into one of the user's Strata Sheets. cells maps cell addresses (A1–Z200) to string values; a value starting with '=' is a formula (arithmetic, cell refs, ranges like A1:A5 inside functions, and SUM, AVERAGE, COUNT, MIN, MAX, ROUND, ABS). An empty string clears a cell. Omit name for the active sheet; naming a sheet that doesn't exist creates it. Write only when the user asks or clearly wants the sheet changed.",
      inputSchema: { type: 'object',
        properties: {
          name: { type: 'string', description: 'sheet name; omit for the active sheet' },
          cells: { type: 'object',
            description: 'map of cell address to value, e.g. {"A1":"Rent","B1":"1200","B4":"=SUM(B1:B3)"}',
            additionalProperties: { type: 'string' } },
        },
        required: ['cells'] },
      execute: (a) => {
        let s = (a && a.name) ? sheets.byName(a.name) : sheets.active();
        let created = false;
        if (!s) { s = sheets.create((a && a.name) || undefined); created = true; }
        let wrote = 0;
        const bad = [];
        Object.entries((a && a.cells) || {}).forEach(([k, v]) => {
          const ref = shParseRef(String(k).toUpperCase().trim());
          if (!ref || ref.r >= sheets.MAX_ROWS) { bad.push(String(k)); return; }
          sheets.growTo(s, ref.r + 1, ref.c + 1);
          sheets.setCell(s, ref.addr, String(v === undefined || v === null ? '' : v));
          wrote += 1;
        });
        if (!wrote) throw new Error('No valid cell addresses — use A1–Z' + sheets.MAX_ROWS + '.');
        actions.push((created ? 'new sheet ' : '') + '"' + s.name + '" — ' + wrote + ' cell(s)');
        shRender();
        return { ok: true, sheet: s.name, wrote: wrote, created: created,
                 skipped: bad, csv: shToCSV(s) };
      } },
  ];
}

/* ---------- sending ---------------------------------------------------- */

async function send() {
  const box = $('msg');
  const text = box.value.trim();
  if (!text) return;

  turn('You', markdown(text), 'me');
  box.value = '';
  box.style.height = 'auto';
  kbdSeqUpdate();   // the sequence bar mirrors the (now empty) box

  /* A slash command is an instruction to the console, not a question for
     the assistant. Same grammar as the desktop, one copy of it. */
  if (text.startsWith('/')) {
    const c = runCommand(text);
    if (c.handled) {
      if (c.clearLog) {
        stopReading();
        log.innerHTML = '';
        lastReply = ''; lastSpeakable = ''; lastTurn = null;
      }
      if (c.message) {
        if (c.markdown) lastTurn = turn('Strata', markdown(c.message));
        else note(c.message, !!c.bad);
      }
      if (c.status) $('status').textContent = c.status;
      if (c.zone) setZone(c.zone);
      box.focus();
      return;
    }
  }

  /* The pipeline runs whether or not the pod assistant answers: its
     structured output is the fallback and the telemetry. */
  const d = classifyInput(text);
  avSetGlyphs(d.glyphs);   // the message's operator tokens light the avatar
  const routePath = route(d);
  let context = retrieveContext();

  /* Snapshot-at-dispatch (H6): freeze this turn's configuration NOW.
     Everything downstream — prompt conditioning, matrix lookups, the
     model tier, the template, the thread record, the response header —
     reads the frozen copy, so a control flipped while the answer
     streams cannot rewrite a turn already in flight. The turn clock
     stamps it into a total order that survives reloads. */
  turnClock += 1;
  store.setState('turn_clock', String(turnClock));
  const turnSeq = turnClock;
  const turnZone = zone;
  const turnOverlay = overlayMode;
  const turnLoad = cogLoad;

  const tone = TONES[turnZone] || TONES.GREEN;
  const template = synthesizeTemplate(d, routePath, context, tone, turnZone);

  /* Grounding is gathered by the page, never by the model: the attached
     document, and — when the box is ticked — the viewer's Google Drive. */
  let extra = attachmentContext(text, attachment).slice(0, 6000);
  const used = [];
  if (attachment && extra) used.push('📎 ' + attachment.name);
  /* The image lane: an attached image bypasses retrieval entirely and
     rides with the pod call itself — the assistant looks at the pixels,
     not at ranked passages. Whether it can go is settled after podReady. */
  const imageAtt = (attachment && attachment.image) ? attachment : null;

  /* The knowledge base is the one LOCAL source: no bridge, no cloud
     call — searched synchronously, before any connector is consulted. */
  if ($('src-kb').checked) {
    const kc = kbContext(text);
    if (kc.text) {
      extra = (extra ? extra + '\n\n' : '') + kc.text;
      kc.names.forEach((n) => used.push('🗂 ' + n));
    }
  }

  /* Typing "search the web for …" counts as ticking the box — the
     desktop rule, restored now that the box is live. */
  const useWeb = $('src-web').checked || wantsWeb(text);

  const pending = turn('Strata', '<p class="thinking">thinking…</p>');
  const pendingBody = pending.querySelector('.body');
  $('send').disabled = true;

  /* A wait with no evidence of progress cannot be told apart from a
     hang, so the placeholder counts out loud — and the pod assistant
     streams, which is the strongest evidence of progress there is. */
  await podReady;
  await capsReady;
  const firstCall = !!pod && !podTried;
  const sendImage = !!(imageAtt && pod && imageCaps);
  if (imageAtt && !sendImage) {
    note('🖼 The image cannot be examined in this view — the ' +
         (pod ? 'view does not allow sending images' : 'template engine has no eyes') +
         ' — answering from text only.', true);
  }
  if (sendImage) used.push('🖼 ' + imageAtt.name);
  let base = (pod ? busyLabel(!!extra, firstCall, sendImage) : 'template engine').replace(/…$/, '');
  $('status').textContent = base + '…';

  const startedAt = Date.now();
  const tick = () => {
    const think = pending.querySelector('.thinking');
    if (!think) return;
    const secs = Math.floor((Date.now() - startedAt) / 1000);
    think.textContent = secs < 1 ? base + '…' : `${base}… ${secs}s`;
  };
  tick();
  const ticker = setInterval(tick, 1000);

  /* Drive is consulted BEFORE the assistant runs, like every source. */
  if ($('src-drive').checked) {
    await mcpReady;
    if (!mcp) {
      note('☁ The Google Drive bridge is not available in this view — answering without it.', true);
    } else {
      base = '🔎 searching Google Drive';
      tick();
      try {
        const dr = await driveContext(text);
        if (dr.text) {
          extra = (extra ? extra + '\n\n' : '') + dr.text;
          dr.names.forEach((n) => used.push('☁ ' + n));
        } else {
          note('☁ Nothing in Drive matched this message — answering without it.');
        }
      } catch (e) {
        note('☁ ' + connectorErrorNote('Google Drive', e), true);
      }
      base = (pod ? busyLabel(true, firstCall, sendImage) : 'template engine').replace(/…$/, '');
      tick();
    }
  }
  if (useWeb) {
    await mcpReady;
    if (!mcp) {
      note('🌐 The web-search bridge is not available in this view — answering without it.', true);
    } else {
      base = '🔎 searching the web';
      tick();
      try {
        const wt = await webContext(text);
        if (wt) {
          extra = (extra ? extra + '\n\n' : '') + wt;
          used.push('🌐 web (Exa)');
        } else {
          note('🌐 The search returned nothing usable — answering without it.');
        }
      } catch (e) {
        note('🌐 ' + connectorErrorNote('Exa', e), true);
      }
      base = (pod ? busyLabel(true, firstCall, sendImage) : 'template engine').replace(/…$/, '');
      tick();
    }
  }
  const fullContext = extra
    ? context + '\n\nAdditional context (web/files/knowledge base):\n' + extra.slice(0, 12000)
    : context;

  let reply = null;
  let streamed = false;
  const kbActions = [];      // what the assistant wrote to the KB this turn
  const sheetActions = [];   // what the assistant wrote to the sheets this turn

  try {
    if (pod) {
      podTried = true;
      busyCtl = new AbortController();
      /* Standing instructions lead; the recent conversation rides in
         the middle as real turns; the new message closes the list. */
      const imageLine = sendImage
        ? "\nThe user's attached image '" + imageAtt.name + "' is provided " +
          'with the newest message — look at it directly and answer from ' +
          'what you see. It stays attached until the user removes it.'
        : '';
      const turns = [
        { role: 'user', content: podRules(tone, d.glyphMeanings, fullContext, !!extra,
                                          turnZone, turnOverlay, turnLoad) + imageLine },
        ...store.recallTurns(),
        { role: 'user', content: text },
      ];
      try {
        const opts = {
          cache: false,
          signal: busyCtl.signal,
          modelTier: ZONE_TIER[turnZone] || 'default',
          /* The KB tools ride along on every call: search, plus the
             writes — createCard, saveNote, addJournalEntry,
             addGlossaryTerm. Each executes in this page, on this
             browser's stores, and is logged and reported. */
          tools: kbAssistantTools(kbActions).concat(sheetAssistantTools(sheetActions)),
          onText: ({ text: t }) => {
            streamed = true;
            pending.classList.add('streaming');
            pendingBody.innerHTML = markdown(t);
            log.scrollTop = log.scrollHeight;
          },
        };
        /* The image lane joins here: the attachment's pixels ride with
           this call. Re-sent each turn while attached — the assistant
           has no memory between calls, so the attachment IS the memory. */
        if (sendImage) opts.images = [imageAtt.image];
        const r = await pod(turns, opts);
        reply = r.text;
        if (r.truncated) note('The answer hit the length limit — ask for less at a time.', true);
      } catch (e) {
        const code = (e && e.code) || 'upstream_error';
        podLastError = code;
        if (code !== 'cancelled') avErrorAt = Date.now();   // the avatar shows it
        if (code === 'cancelled') {
          reply = (e && e.text) || null;
          note(reply ? '■ Stopped — the partial answer is kept.' : '■ Stopped.');
        } else if (['not_granted', 'sampling_disabled', 'not_declared',
                    'capability_disabled', 'capability_removed'].includes(code)) {
          pod = null;
          note('🧩 The pod assistant is not available in this view (' + code +
               ') — template mode from here on.', true);
        } else if (code === 'images_unavailable') {
          imageCaps = null;
          reply = (e && e.text) || null;
          note('🖼 This view cannot send images after all — Remove the image ' +
               'and ask again in text.', true);
        } else if (code === 'image_rejected') {
          reply = (e && e.text) || null;
          note('🖼 The image was not accepted — wrong type, undecodable, or ' +
               'too large. Try a different file, or Remove it.', true);
        } else if (code === 'refused') {
          reply = null;   // any partial is withdrawn; do not keep it
          note('The pod assistant declined this input — the template engine answered instead.', true);
        } else if (code === 'rate_limited') {
          reply = (e && e.text) || null;
          note('The pod assistant is rate-limited right now — try again in a little while.', true);
        } else {
          reply = (e && e.text) || null;
          note('Pod assistant error (' + code + ') — ' +
               (reply ? 'keeping the partial answer.' : 'the template engine answered instead.'), true);
        }
      } finally {
        busyCtl = null;
      }
    }

    /* Template mode: the deterministic four-part output, exactly as the
       desktop composes it when the model is away. */
    if (reply === null || reply === undefined || !String(reply).trim()) {
      reply = [template.summary, template.description, template.comments]
        .filter(Boolean).join(' ');
    }

    pending.classList.remove('streaming');
    pendingBody.innerHTML = markdown(reply);
    /* Mode-aware response header (v2): every answer says when it came,
       under which mode and overlay, and at what target load. */
    const rhead = document.createElement('p');
    rhead.className = 'used';
    rhead.textContent = '#' + turnSeq + ' · ' + new Date().toLocaleTimeString() +
      ' · ' + turnZone +
      (turnOverlay !== 'off' ? ' · ' + OVERLAYS[turnOverlay].label : '') +
      ' · load ' + turnLoad + '/10';
    rhead.title = 'This turn\'s FROZEN configuration — captured when you pressed ' +
      'Send, so it names the settings that actually shaped this answer, even ' +
      'if you changed them while it streamed. # is the turn\'s place in the ' +
      'session\'s total order.';
    pending.insertBefore(rhead, pendingBody);
    if (used.length) {
      const src = document.createElement('p');
      src.className = 'used';
      src.textContent = 'Read: ' + used.join(' · ');
      pending.appendChild(src);
    }
    if (kbActions.length) {
      note('🗂 Knowledge base updated — ' + kbActions.join(' · '));
      kbRender();
    }
    if (sheetActions.length) {
      note('📊 Sheets updated — ' + sheetActions.join(' · ') + ' (📊 Sheets shows it).');
      shBadge();
    }
    /* Matrix escalations arrive as ONE quiet suggestion, never a switch —
       judged against the turn's frozen overlay, not whatever it is now. */
    if (turnOverlay !== 'off') {
      for (const g of d.glyphs) {
        const b = glyphModeBehavior(g, turnOverlay);
        if (b && b.suggest && b.suggest !== turnOverlay && OVERLAYS[b.suggest]) {
          note(g + ' with ' + OVERLAYS[turnOverlay].label + ' often pairs with ' +
               OVERLAYS[b.suggest].label + ' — /overlay ' + b.suggest +
               ' if you want it. Your call, never automatic.');
          break;
        }
      }
    }
    lastReply = reply;
    lastSpeakable = speakable(reply);
    lastTurn = pending;
    store.addThread(text, turnZone);
    store.addChatTurn('user', text);
    store.addChatTurn('assistant', reply);
    $('status').textContent = getStatus();
    if ($('autoread').checked) readAlong(pending, lastSpeakable);
  } finally {
    clearInterval(ticker);
    pending.classList.remove('streaming');
    $('send').disabled = false;
    log.scrollTop = log.scrollHeight;
  }
}

/* ---------- dictation --------------------------------------------------
 * The browser's speech engine sits where Whisper sat. The spoken-
 * punctuation kernel is the same one, ported: say "period", "new line",
 * "cap", "all caps on" — and duplicates against the engine's own
 * punctuation collapse to the strongest mark. */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let recFinal = '';

/* A cross-origin frame only gets the microphone when its host DELEGATES
 * it (an `allow="microphone"` on the iframe). Where the host does not,
 * the browser hard-blocks the mic — no permission prompt can even
 * appear, so asking would fail silently. The page can read that verdict
 * itself from its own permissions policy, so the Speak button can say
 * why up front — the same stays-visible-and-says-why pattern the
 * Whisper tier control uses — instead of failing on the first click. */
function micBlockedReason() {
  if (!SR) return 'no-engine';
  try {
    const pp = document.permissionsPolicy || document.featurePolicy;
    if (pp && typeof pp.allowsFeature === 'function' &&
        !pp.allowsFeature('microphone')) {
      return 'frame-blocked';
    }
  } catch (e) { /* cannot tell here — let the click find out */ }
  return null;
}

const MIC_FRAME_NOTE =
  '🎤 Dictation is blocked in this view: the page is embedded in a frame ' +
  'that does not delegate microphone access, so the browser refuses the ' +
  'mic before any permission prompt can appear. Not a fault in the ' +
  'console — the same code dictates fine where the page runs top-level, ' +
  'and the desktop console is unaffected. Typing and 🔊 read-aloud both ' +
  'work here.';

function micIdle() {
  const b = $('mic');
  recording = false;
  b.setAttribute('aria-pressed', 'false');
  b.innerHTML = '<span aria-hidden="true">🎤</span> Speak';
}

function toggleMic() {
  const b = $('mic');
  if (!SR) {
    note('This browser has no speech recognition engine — dictation runs in ' +
         'Chrome and Edge, or in the desktop console.', true);
    return;
  }
  if (!recording && micBlockedReason() === 'frame-blocked') {
    note(MIC_FRAME_NOTE, true);
    return;
  }
  if (!recording) {
    recFinal = '';
    try {
      rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i += 1) {
          if (e.results[i].isFinal) recFinal += e.results[i][0].transcript + ' ';
        }
      };
      rec.onerror = (e) => {
        micIdle();
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          note(MIC_FRAME_NOTE, true);
        } else if (e.error === 'no-speech') {
          note('No speech was heard.');
        } else {
          note('Dictation error: ' + e.error, true);
        }
        $('status').textContent = getStatus();
      };
      rec.onend = () => {
        if (recording) { micIdle(); }
        const polished = polish(recFinal.trim());
        if (polished) {
          const box = $('msg');
          box.value = (box.value ? box.value + ' ' : '') + polished;
          box.focus();
          grow(box);
        }
        $('status').textContent = getStatus();
      };
      rec.start();
      recording = true;
      b.setAttribute('aria-pressed', 'true');
      b.innerHTML = '<span aria-hidden="true">■</span> Stop';
      $('status').textContent = 'Listening — speak, then press Stop.';
    } catch (err) {
      micIdle();
      note('Dictation could not start here: ' + err, true);
    }
  } else {
    micIdle();
    $('status').textContent = 'Transcribing…';
    try { rec && rec.stop(); } catch (err) { /* onend still fires */ }
  }
}

function grow(box) {
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, window.innerHeight * 0.3) + 'px';
}

/* ---------- context sources: upload ------------------------------------ */

function showAttachment(label) {
  const out = $('attached');
  const off = $('detach');
  if (label) {
    out.textContent = label;
    out.title = label;
    off.hidden = false;
  } else {
    out.textContent = '';
    out.title = '';
    off.hidden = true;
  }
}

const TEXT_EXTS = ['.txt', '.md', '.markdown', '.csv', '.html', '.htm', '.json', '.log'];

const IMAGE_EXTS = ['.png', '.jpg', '.jpeg', '.webp', '.gif'];

function handleImageFile(file) {
  const name = file.name;
  if (!imageCaps) {
    note(`🖼 Couldn't attach ${name} — this view can't send images to the ` +
         'pod assistant' +
         (pod === null ? ' (the assistant itself is not available here)' : '') +
         '. Text attachments still work.', true);
    return;
  }
  if (file.type && imageCaps.mediaTypes && imageCaps.mediaTypes.length &&
      !imageCaps.mediaTypes.includes(file.type)) {
    note(`🖼 ${name} is a type this view doesn't accept — it takes ` +
         imageCaps.mediaTypes.join(', ') + '.', true);
    return;
  }
  if (imageCaps.maxInputBytes && file.size > imageCaps.maxInputBytes) {
    const mb = Math.round(imageCaps.maxInputBytes / 1048576);
    note(`🖼 ${name} is too large — this view accepts images up to about ${mb} MB.`, true);
    return;
  }
  attachment = { name: name, image: file };
  const sizeKB = Math.max(1, Math.round(file.size / 1024));
  showAttachment(`🖼 ${name} (${sizeKB} KB) — attached; Remove detaches it`);
  note(`🖼 Attached ${name}. Ask me about it — the pod assistant sees the ` +
       'image itself with each message while it stays attached. It rides ' +
       'beside the text, not through the retrieval kernel, and Remove ' +
       'detaches it.');
}

function handleFile(file) {
  if (!file) return;
  const name = file.name;
  const ext = (name.lastIndexOf('.') >= 0 ? name.slice(name.lastIndexOf('.')) : '').toLowerCase();
  if (/^image\//.test(file.type || '') || IMAGE_EXTS.includes(ext)) {
    handleImageFile(file);
    return;
  }
  if (!TEXT_EXTS.includes(ext)) {
    note(`📎 Couldn't read ${name} — the browser build reads text formats ` +
         `(${TEXT_EXTS.join(' ')})` +
         (imageCaps ? ' and images (PNG, JPEG, WebP, GIF)' : '') +
         '. .docx/.pdf/.xlsx extraction is a desktop-console feature.', true);
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => note(`📎 Couldn't read ${name} — the file did not open.`, true);
  reader.onload = () => {
    let body = String(reader.result || '');
    if (ext === '.html' || ext === '.htm') {
      try {
        const doc = new DOMParser().parseFromString(body, 'text/html');
        body = (doc.body && doc.body.textContent) || '';
      } catch (e) { /* keep the raw text */ }
    }
    if (!body.trim()) {
      note(`📎 Couldn't read ${name} — unsupported format or empty file.`, true);
      return;
    }
    let clipped = false;
    if (body.length > MAX_ATTACHMENT_CHARS) { body = body.slice(0, MAX_ATTACHMENT_CHARS); clipped = true; }
    attachment = { name: name, text: body };
    showAttachment(attachmentLabel(name, body.length));
    note(`📎 Attached ${name}. Ask me about it — I'll read the relevant parts. ` +
         'It stays attached until you remove it.' +
         (clipped ? ' (Very large file — the first two million characters are held.)' : ''));
  };
  reader.readAsText(file);
}

/* ---------- telemetry --------------------------------------------------
 * The desktop header shows free system RAM because the machine's
 * condition is the biggest factor in how that app feels. A page cannot
 * read system RAM; what it CAN measure honestly is its own JS heap, so
 * that is what is shown, labelled as exactly that. */

function showHeap() {
  const el = $('ram');
  try {
    const m = performance.memory;
    el.textContent = (m && m.usedJSHeapSize)
      ? 'heap ' + Math.round(m.usedJSHeapSize / 1048576).toLocaleString() + ' MB'
      : '';
  } catch (e) { el.textContent = ''; }
}

/* ---------- boot -------------------------------------------------------- */

  if (podFn) {
    return 'Web build online — **pod assistant** in the local model\'s seat.\n\n' +
      'Same pipeline as the desktop console: five stages, same modes, same ' +
      'commands, same clear floor. Press **Speak** to dictate, or just type.\n\n' +
      'While an answer is read aloud, the sentence being spoken is highlighted ' +
      'so you can follow along — click any sentence to hear it again from there. ' +
      'Tick **Auto** to have every answer read as it arrives.\n\n' +
      'Tick **🌐 Web search** or **☁ Google Drive** — or press **📎 Upload ' +
      'document** — and I will read those before answering, citing what I ' +
      'read. Google Sheets come through ☁. Saying "search the web for …" ' +
      'works without touching the box.\n\n' +
      (imageCaps
        ? 'Images work here too: attach a **PNG, JPEG, WebP or GIF** with 📎 ' +
          'and I can examine the image itself — new in the web build.\n\n'
        : '') +
      'The **🗂 Knowledge Base** is new — the Study Workstation, resident ' +
      'in the console: a Library, note cards, Notes, a Journal and a ' +
      'Glossary, kept in this browser. With **🗂 Knowledge** ticked I read ' +
      'them before answering — and I can write to them too: ask me to ' +
      'capture a card, save a note, journal the session, or define a term. ' +
      '`/kb` shows what\'s stored.\n\n' +
      'The **⌨ glyph keyboard** is new — press **Alt+K** or the ⌨ Glyphs ' +
      'button beside the message box: eighteen codex keys in two banks, ' +
      'the grammar operators, and a sequence bar that translates your ' +
      'chain as you build it. Alt+1–0 type the core ten from anywhere; ' +
      '`/lexicon` shows what each glyph tells me.\n\n' +
      'And **📊 Sheets** is a working spreadsheet in the console: cells ' +
      'A1–Z200, formulas starting with = (SUM, AVERAGE, COUNT, MIN, MAX, ' +
      'ROUND, ABS), CSV import and export. Ask me to read a sheet, total a ' +
      'column, or build one for you — I write real formulas, so the sheet ' +
      'stays live when you edit it. `/sheet` opens it.\n\n' +
      'I keep the recent conversation in recall — even across a reload — so you ' +
      'can ask me about something we said and I can call it back. **Clear** ' +
      'archives it out of recall; nothing is deleted.\n\n' +
      'One honest difference: the desktop console is local-first, and this page ' +
      'is not — the pod assistant is a cloud call, made only with your ' +
      'permission, and your browser will ask the first time. `/port` lists ' +
