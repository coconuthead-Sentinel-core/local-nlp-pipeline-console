  }
  return 'Web build online — **template mode**.\n\n' +
    'The pod assistant is not answering in this view, so responses use the ' +
    'deterministic engine — the same structured fallback the desktop console ' +
    'uses when its local model is away. The pipeline, commands, modes, ' +
    'read-along, dictation and upload retrieval all still run.\n\n' +
    '`/port` lists what carried over from the desktop build.';
}

function start(hotData) {
  /* Preferences, exactly as the desktop bridge restored them. */
  const font = store.getState('web_font', 'system');
  document.documentElement.dataset.font = font;
  $('font').value = font;
  applySize(size);
  /* Omega-1 controls: the overlay list is built from OVERLAYS so the
     dropdown and /overlay can never disagree. */
  const ovSel = $('overlay');
  Object.entries(OVERLAYS).forEach(([key, o]) => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = o.label;
    ovSel.appendChild(opt);
  });
  ovSel.value = overlayMode;
  $('cogload').value = cogLoad;
  $('cogload-out').value = cogLoad + '/10';
  if (overlayMode === 'crisis_triage') crisisEnter(true);
  $('autoread').checked = store.getState('autoread', '0') === '1';
  $('src-drive').checked = store.getState('src_drive', '0') === '1';
  $('src-web').checked = store.getState('src_web', '0') === '1';
  /* The knowledge base defaults ON: it is local, free, and silent when
     nothing in it matches — the safest kind of grounding. */
  $('src-kb').checked = store.getState('src_kb', '1') === '1';
  kbBadge();
  shBadge();
  const lifecycle = kb.autoArchive(30);
  if (lifecycle.decayed) {
    note('🗂 ' + lifecycle.decayed + ' 🎯 Target card(s) older than 7 days softened to 🌀 Iterate ' +
         '— recorded in each card\'s glyph history.');
  }
  if (lifecycle.archived) {
    note('🗂 ' + lifecycle.archived + ' card(s) older than 30 days moved to the RED zone ' +
         '(🧊 Golden Source cards are exempt). Nothing was deleted — change a ' +
         'card\'s zone to bring it back.');
  }
  setZone(zone);
  $('status').textContent = getStatus();
  showHeap();

  /* Speak stays visible when the frame blocks the mic — dimmed, with
     the reason on hover and on click — the delta documented in the UI,
     exactly as the Whisper tier control does it. */
  const micReason = micBlockedReason();
  if (micReason) {
    const mb = $('mic');
    mb.style.opacity = '.55';
    mb.title = micReason === 'no-engine'
      ? 'This browser has no speech recognition engine — dictation runs in Chrome and Edge, or in the desktop console.'
      : 'Blocked by the hosting frame: it does not delegate microphone access, so the browser refuses the mic here. The desktop console is unaffected.';
  }

  if (hotData && hotData.html) {
    /* A republish reached an open view: keep the conversation on screen. */
    log.innerHTML = hotData.html;
    if (hotData.zone && hotData.zone in TONES) { zone = hotData.zone; setZone(zone); }
    $('status').textContent = getStatus();
    return;
  }

  const boot = turn('Strata', markdown('Web build online — checking for the **pod assistant**…'));
  Promise.all([podReady, capsReady]).then(([fn]) => {
    boot.querySelector('.body').innerHTML = markdown(bootMessage(fn));
    lastTurn = boot;
    lastSpeakable = speakable(bootMessage(fn));
    $('status').textContent = getStatus();
    log.scrollTop = log.scrollHeight;
  });
}

/* ---------- wiring ------------------------------------------------------ */

$('composer').addEventListener('submit', (e) => { e.preventDefault(); send(); });

const box = $('msg');
box.addEventListener('input', () => { grow(box); kbdSeqUpdate(); });
box.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

$('bigger').addEventListener('click', () => applySize(size + 2));
$('smaller').addEventListener('click', () => applySize(size - 2));

$('font').addEventListener('change', (e) => {
  document.documentElement.dataset.font = e.target.value;
  store.setState('web_font', e.target.value);
});

$('mic').addEventListener('click', toggleMic);

$('overlay').addEventListener('change', (e) => {
  setOverlay(e.target.value);
  $('status').textContent = getStatus();
});

$('cogload').addEventListener('input', (e) => {
  const v = parseInt(e.target.value, 10);
  cogLoad = (v >= 1 && v <= 10) ? v : 5;
  $('cogload-out').value = cogLoad + '/10';
  store.setState('cog_load', String(cogLoad));
  kbdRender();   // the keyboard's load dimming follows the dial
});

$('src-web').addEventListener('change', async (e) => {
  store.setState('src_web', e.target.checked ? '1' : '0');
  if (!e.target.checked) {
    note('🌐 Web search off. Saying "look this up" still works for one message.');
    return;
  }
  await mcpReady;
  if (!mcp) {
    e.target.checked = false;
    store.setState('src_web', '0');
    note('🌐 The web-search bridge is not available in this view.', true);
    return;
  }
  note('🌐 Web search ON — I will search before answering, and cite what I ' +
       'read. Your browser may ask permission on the first search.');
});

$('src-drive').addEventListener('change', async (e) => {
  store.setState('src_drive', e.target.checked ? '1' : '0');
  if (!e.target.checked) { note('☁ Google Drive off.'); return; }
  await mcpReady;
  if (!mcp) {
    e.target.checked = false;
    store.setState('src_drive', '0');
    note('☁ The Google Drive bridge is not available in this view.', true);
    return;
  }
  note('☁ Google Drive ON — I will search your Drive for each message and ' +
       'read the most relevant files (Google Sheets included), citing what I ' +
       'read. Your browser may ask permission on the first search.');
});

$('upload').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => {
  handleFile(e.target.files && e.target.files[0]);
  e.target.value = '';
});
$('detach').addEventListener('click', () => {
  if (!attachment) return;
  attachment = null;
  showAttachment(null);
  note('📎 Attachment removed.');
});

$('avatar').addEventListener('click', () => avToggle());

$('kbd-open').addEventListener('click', () => kbdToggle());

$('sheet-open').addEventListener('click', () => shToggle());

/* Knowledge base wiring — the drawer, the source box, the library file. */
$('kb-open').addEventListener('click', () => kbToggle());
$('src-kb').addEventListener('change', (e) => {
  store.setState('src_kb', e.target.checked ? '1' : '0');
  note(e.target.checked
    ? '🗂 Knowledge base ON — I will search your library, cards, notes, ' +
      'journal and glossary before answering, and cite what I read. The ' +
      'search runs in this page; nothing leaves this browser to do it.'
    : '🗂 Knowledge base off — I will not read it until you turn it back on.');
});
$('kb-file').addEventListener('change', (e) => {
  kbHandleFile(e.target.files && e.target.files[0]);
  e.target.value = '';
});
$('kb-go').addEventListener('click', () => kbDoSearch($('kb-q').value));
$('kb-q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); kbDoSearch(e.target.value); }
});

$('read').addEventListener('click', () => {
  if (speaking) { stopReading(); return; }
  if (!lastTurn) { note('Nothing to read yet — send a message first.'); return; }
  readAlong(lastTurn, lastSpeakable);
});

$('autoread').addEventListener('change', (e) => {
  store.setState('autoread', e.target.checked ? '1' : '0');
  note(e.target.checked
    ? 'Auto-read ON — answers will be spoken as they arrive, with the sentence highlighted.'
    : 'Auto-read off — use the Read button.');
});

$('clear').addEventListener('click', () => {
  stopReading();
  const cleared = store.raiseFloor();
  log.innerHTML = '';
  lastReply = '';
  lastSpeakable = '';
  lastTurn = null;
  note(clearReport(cleared, store.archivedCount()));
  $('status').textContent = getStatus();
  $('msg').focus();
});

$('help').addEventListener('click', () => {
  lastTurn = turn('Strata', markdown([
    '### Keyboard',
    '- **Tab** moves through every control — all of them, natively.',
    '- **Alt+K** opens the ⌨ glyph keyboard; **Alt+1–0** type the core ten glyphs from anywhere.',
    '- **Enter** sends. **Shift+Enter** starts a new line.',
    '- **Ctrl+L** clears the window and what the assistant recalls.',
    '- **Escape** stops reading aloud — and stops the pod assistant mid-answer.',
    '',
    '### Reading along',
    'While an answer is spoken, the current sentence is highlighted and',
    'the current word is underlined. Click any sentence to hear it again',
    'from that point. Tick **Auto** to have every answer read as it arrives.',
    '',
    '### Speaking punctuation while you dictate',
    'Say `period`, `comma`, `question mark`, `new line`, `new paragraph`,',
    '`open paren` / `close paren`, `cap <word>`, `all caps on` … `all caps off`.',
    'If the recogniser already heard the pause and punctuated it, the',
    'duplicate is cleaned up for you.',
  ].join('\n') + '\n\n' + helpText()));
});

document.querySelectorAll('.mode').forEach((b) => {
  b.addEventListener('click', () => {
    const msg = changeZone(b.dataset.zone);
    setZone(zone);
    note(msg);
    $('status').textContent = getStatus();
  });
});

document.addEventListener('keydown', (e) => {
  /* Alt-chords for the keyboard — Alt, not bare letters, because a
     single-letter hotkey would fire while typing in a chat-first page. */
  if (e.altKey && !e.ctrlKey && !e.metaKey) {
    if (e.code === 'KeyK') { e.preventDefault(); kbdToggle(); return; }
    const m = /^Digit(\d)$/.exec(e.code || '');
    if (m && KBD_ALT_DIGITS[m[1]]) { e.preventDefault(); kbdPress(KBD_ALT_DIGITS[m[1]]); return; }
  }
  if (e.ctrlKey && e.key.toLowerCase() === 'l') {
    e.preventDefault();
    $('clear').click();
  }
  if (e.key === 'Escape') {
    if (busyCtl) { e.preventDefault(); busyCtl.abort(); }
    else if (speaking) { e.preventDefault(); stopReading(); }
  }
});

setInterval(showHeap, 5000);

/* Hot-reload continuity: a republish reaching an open view keeps the
   conversation. Guarded — the desktop shell has no such hook, and a
   plain browser doesn't either. */
try {
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(() => ({ html: log.innerHTML, zone: zone }));
  }
} catch (e) { /* continuity is a bonus, never load-bearing */ }

const hot = (window.claude && window.claude.hot) || null;
if (hot && hot.ready) hot.ready(start);
else start((hot && hot.data) || {});
</script>
