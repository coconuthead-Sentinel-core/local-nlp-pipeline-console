<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Strata Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Strata Console — browser build.
 *
 * The colours are the SAME measured values the desktop shell committed to
 * in strata_tools/theme.py and strata_tools/modes.py (WCAG AA, measured,
 * not chosen by eye). This build keeps the console's one dark visual
 * world deliberately, and paints every colour explicitly so the page
 * holds on any host ground. */

:root {
  --ground:   #12161A;
  --frame:    #2B2B2B;
  --surface:  #1D2228;
  --ink:      #DCE4EE;
  --ink-mute: #9AA6B2;
  --outline:  #C0CAD5;
  --fill:     #1A5A8C;
  --fill-hi:  #144870;
  --focus:    #FFFFFF;

  /* Zone hues, third pass (2026-09-11). The lesson of the first two:
     a DARKENED hue is not that hue — dark yellow reads brown, dark red
     reads purple, on real screens and doubly under a colour overlay.
     So no darkened hue fills remain anywhere. At rest a zone button is
     neutral (--surface) and carries its hue at FULL saturation in a
     solid dot and a 2px border; active, the hue takes the whole button
     with dark text. Red is a warm vermilion — enough orange in it that
     no display drifts it toward purple. Every pair re-measured: text
     ≥ 4.5:1, dot/border marks ≥ 3:1. */
  --zone-ink:   #12161A;  /* text on an active zone fill */
  --green-hi:   #4CAF50;  --green-hov:  #43A047;   /* 6.54:1 / 5.50:1 dark text */
  --yellow-hi:  #FFC400;  --yellow-hov: #EDB600;   /* 11.38:1 / 9.77:1 dark text */
  --red-hi:     #F25430;  --red-hov:    #E64A2E;   /* 5.27:1 / 4.66:1 dark text */

  --text: 17px;
  --font: system-ui, "Segoe UI", sans-serif;
}

html[data-font="atkinson"]     { --font: "Atkinson Hyperlegible", system-ui, sans-serif; }
html[data-font="opendyslexic"] { --font: "OpenDyslexic", "OpenDyslexic3", system-ui, sans-serif; }
html[data-font="verdana"]      { --font: Verdana, Geneva, sans-serif; }
html[data-font="serif"]        { --font: Georgia, "Times New Roman", serif; }

* { box-sizing: border-box; }

html { height: 100%; background: #12161A; }

body {
  height: 100vh;
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--text);
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  /* The transcript takes what is left and scrolls; every drawer row —
     the avatar panel, the Knowledge Base, the glyph keyboard — collapses
     to nothing while hidden. Flex, not counted grid rows: drawers can
     come and go without anything landing in the wrong track. */
  gap: 8px;
  padding-block: 10px 12px;
  padding-inline: 16px;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 6px;
}

.skip {
  position: absolute;
  left: -9999px;
  background: var(--fill);
  color: var(--ink);
  padding: 10px 16px;
  border-radius: 6px;
  z-index: 10;
}
.skip:focus { left: 16px; top: 12px; }

.sr {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

/* --- top bar ---------------------------------------------------------- */
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.brand { font-weight: 700; letter-spacing: -0.01em; font-size: 1.05em; }
.brand span { color: var(--ink-mute); font-weight: 400; margin-left: .3em; }

.tag {
  font-size: .72em;
  color: var(--ink-mute);
  border: 1px solid var(--frame);
  border-radius: 999px;
  padding: 2px 9px;
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
}

.grp { display: flex; align-items: center; gap: 6px; }
.lbl { color: var(--ink-mute); font-size: .85em; }
.size { color: var(--ink-mute); font-size: .85em; min-width: 5ch; font-variant-numeric: tabular-nums; }

.status {
  margin: 0 0 0 auto;
  color: var(--ink-mute);
  font-size: .85em;
  text-align: right;
}

/* --- controls --------------------------------------------------------- */
.ctl {
  font: inherit;
  font-size: .9em;
  color: var(--ink);
  background: var(--fill);
  border: 1px solid var(--outline);
  border-radius: 6px;
  padding: 10px 14px;
  min-height: 44px;
  cursor: pointer;
}
.ctl:hover { background: var(--fill-hi); }
.ctl:disabled { opacity: .5; cursor: not-allowed; }

select.ctl { padding-right: 8px; }

.check {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: .9em;
  min-height: 44px;
  padding: 0 6px;
}
.check input { width: 24px; height: 24px; accent-color: var(--fill); }
.check input[type=range] { width: 96px; height: auto; accent-color: var(--fill); }

/* A desktop-only control stays visible and says why, rather than
   vanishing — the delta between the builds is documented in the UI. */
.check.desktop { color: var(--ink-mute); cursor: help; }
.check.desktop input { accent-color: var(--frame); }
.check .mini {
  font-size: .72em;
  border: 1px solid var(--frame);
  border-radius: 999px;
  padding: 0 7px;
  letter-spacing: .05em;
  text-transform: uppercase;
}

.mic[aria-pressed="true"] { background: #8B1A1A; border-color: var(--focus); }

.tools, .sources { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1 1 auto; }

.attached {
  flex: 1 1 12ch;
  min-width: 0;
  color: var(--ink);
  font-size: .9em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* --- modes ------------------------------------------------------------ */
.modes { display: flex; gap: 8px; flex-wrap: wrap; }

.mode {
  flex: 1 1 0;
  font: inherit;
  font-size: .9em;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--outline);
  border-radius: 6px;
  padding: 10px 12px;
  min-height: 48px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}
.mode small { color: inherit; font-weight: 400; margin-left: auto; }

.mode .dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid currentColor; background: currentColor; flex: none;
}
/* At rest: neutral fill, and the hue at FULL saturation in the dot and
   the border — never a darkened fill, which is where brown and purple
   came from. */
.mode[data-zone="GREEN"]  { border-color: var(--green-hi); }
.mode[data-zone="YELLOW"] { border-color: var(--yellow-hi); }
.mode[data-zone="RED"]    { border-color: var(--red-hi); }
.mode[data-zone="GREEN"] .dot  { color: var(--green-hi); }
.mode[data-zone="YELLOW"] .dot { color: var(--yellow-hi); }
.mode[data-zone="RED"] .dot    { color: var(--red-hi); }

.mode:hover { background: #242B33; }

/* Active: the hue takes the whole button and the text flips dark. The
   state is still carried without colour — dark dot, bold label, 3px
   ink border (WCAG 1.4.1). */
.mode[aria-checked="true"] {
  color: var(--zone-ink);
  border-color: var(--ink);
  border-width: 3px;
  font-weight: 600;
}
.mode[aria-checked="true"] .dot { color: var(--zone-ink); }

.mode[data-zone="GREEN"][aria-checked="true"]  { background: var(--green-hi); }
.mode[data-zone="YELLOW"][aria-checked="true"] { background: var(--yellow-hi); }
.mode[data-zone="RED"][aria-checked="true"]    { background: var(--red-hi); }
.mode[data-zone="GREEN"][aria-checked="true"]:hover  { background: var(--green-hov); }
.mode[data-zone="YELLOW"][aria-checked="true"]:hover { background: var(--yellow-hov); }
.mode[data-zone="RED"][aria-checked="true"]:hover    { background: var(--red-hov); }

/* --- transcript ------------------------------------------------------- */
.log {
  background: var(--surface);
  border: 1px solid var(--frame);
  border-radius: 8px;
  padding: 14px 18px;
  overflow-y: auto;
  flex: 1 1 0;
  min-height: 0;
}

.log .turn { max-width: 68ch; margin: 0 auto 18px; }
.log .turn:last-child { margin-bottom: 0; }

.who {
  font-size: .75em;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 4px;
}
.turn.me .who { color: #8FBEDA; }

.body p { margin: 0 0 .7em; }
.body p:last-child { margin-bottom: 0; }
.body ul, .body ol { margin: 0 0 .7em; padding-left: 1.4em; }
.body h1, .body h2, .body h3 { font-size: 1.08em; margin: .8em 0 .3em; line-height: 1.3; }
.body code {
  font-family: ui-monospace, Consolas, monospace;
  font-size: .9em;
  background: #0E1216;
  border: 1px solid var(--frame);
  border-radius: 4px;
  padding: 1px 5px;
}
.body pre {
  background: #0E1216;
  border: 1px solid var(--frame);
  border-radius: 6px;
  padding: 12px 14px;
  overflow-x: auto;
  margin: 0 0 .7em;
}
.body pre code { background: none; border: 0; padding: 0; }
.body strong { font-weight: 700; }
.body blockquote {
  margin: 0 0 .7em; padding-left: 12px;
  border-left: 3px solid var(--frame); color: var(--ink-mute);
}

.note {
  max-width: 68ch; margin: 0 auto 18px;
  color: var(--ink-mute);
  border-left: 3px solid var(--outline);
  padding-left: 12px;
  font-size: .92em;
}
.note.bad { border-left-color: #E09090; color: #E7B6B6; }

.thinking { color: var(--ink-mute); font-style: italic; }

/* The pod assistant streams; the bar marks text still being written. */
.streaming .body > :last-child::after {
  content: "▍";
  color: var(--ink-mute);
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.used { margin: .6em 0 0; font-size: .85em; color: var(--ink-mute); }

/* --- composer --------------------------------------------------------- */
.composer { display: flex; gap: 8px; align-items: flex-end; }

.composer textarea {
  flex: 1 1 auto;
  min-width: 0;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--outline);
  border-radius: 6px;
  padding: 12px 14px;
  resize: none;
  min-height: 48px;
  max-height: 30vh;
  overflow-y: auto;
}
.composer textarea::placeholder { color: var(--ink-mute); }

.send { min-width: 96px; font-weight: 600; }

@media (prefers-reduced-motion: no-preference) {
  .ctl, .mode { transition: background-color .12s ease; }
}

/* --- knowledge base ----------------------------------------------------
   The Study Workstation's stores, resident in the console: Library,
   Cards, Notes, Journal, Glossary. A drawer, not a page — it opens
   between the sources row and the modes row and takes bounded height,
   so the transcript never loses its room. */
.kb {
  background: var(--surface);
  border: 1px solid var(--frame);
  border-radius: 8px;
  padding: 10px 14px;
  max-height: 36vh;
  overflow-y: auto;
}
.kb-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.kb-tab {
  font: inherit; font-size: .85em; color: var(--ink);
  background: var(--surface); border: 1px solid var(--outline);
  border-radius: 999px; padding: 6px 12px; min-height: 36px; cursor: pointer;
}
.kb-tab:hover { background: #242B33; }
.kb-tab[aria-selected="true"] { background: var(--fill); font-weight: 600; }
.kb-item {
  border: 1px solid var(--frame); border-radius: 6px;
  padding: 8px 10px; margin: 6px 0; font-size: .9em;
}
.kb-item h4 { margin: 0 0 2px; font-size: 1em; }
.kb-meta { color: var(--ink-mute); font-size: .82em; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kb-body { color: var(--ink-mute); white-space: pre-wrap; margin-top: 4px; max-height: 7em; overflow: hidden; }
.kb-form label { display: block; font-size: .82em; color: var(--ink-mute); margin: 8px 0 2px; }
.kb-form input[type=text], .kb-form textarea, .kb-form select {
  width: 100%; font: inherit; font-size: .9em; color: var(--ink);
  background: var(--ground); border: 1px solid var(--outline);
  border-radius: 6px; padding: 8px 10px;
}
.kb-form textarea { min-height: 72px; resize: vertical; }
.kb-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.kb-empty { color: var(--ink-mute); font-size: .9em; padding: 8px; text-align: center; border: 1px dashed var(--frame); border-radius: 6px; }
.kb-zone { font-size: .78em; font-weight: 600; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--frame); }
.kb-zone.GREEN  { color: var(--green-hi);  border-color: var(--green-hi); }
.kb-zone.YELLOW { color: var(--yellow-hi); border-color: var(--yellow-hi); }
.kb-zone.RED    { color: var(--red-hi);    border-color: var(--red-hi); }
.kb-coord { font-family: ui-monospace, Consolas, monospace; font-size: .85em; color: var(--ink-mute); }
.kb-search { margin-bottom: 8px; }
.kb-search input {
  flex: 1 1 16ch; min-width: 0; font: inherit; font-size: .9em;
  color: var(--ink); background: var(--ground);
  border: 1px solid var(--outline); border-radius: 6px;
  padding: 8px 10px; min-height: 44px;
}
.kb-search input::placeholder { color: var(--ink-mute); }

/* --- avatar ------------------------------------------------------------
   The AvatarVisualizer, ported from its React/Tailwind directions into
   the console's own idiom: vanilla SVG, the console's measured hues, and
   real signals rather than demo sliders. Compact in the top bar; the
   full view is a drawer row, so the transcript never loses its room. */
.av-btn {
  width: 52px; height: 52px; padding: 2px; flex: none;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--frame);
  cursor: pointer;
}
.av-btn svg { width: 100%; height: 100%; display: block; }
.av {
  background: var(--surface);
  border: 1px solid var(--frame);
  border-radius: 8px;
  padding: 14px 18px;
  display: flex; gap: 22px; align-items: center; justify-content: center;
  flex-wrap: wrap;
}
.av > svg { width: min(230px, 55vw); height: auto; flex: none; }
.av-stats { font-size: .9em; color: var(--ink-mute); line-height: 1.9; }
.av-stats b { color: #8FBEDA; font-weight: 600; font-variant-numeric: tabular-nums; }

/* --- glyph keyboard ----------------------------------------------------
   The Phase-1 input panel: two banks of codex keys, the grammar
   operators, and a sequence bar that translates the chain as it is
   built. A drawer like the others — bounded, collapsed while hidden —
   sitting directly above the message box it types into. */
.kbd {
  background: var(--surface);
  border: 1px solid var(--frame);
  border-radius: 8px;
  padding: 10px 14px;
  max-height: 42vh;
  overflow-y: auto;
}
.kbd-rows { display: flex; flex-direction: column; gap: 4px; }
.kbd-empty {
  margin: 0; padding: 6px 2px;
  color: var(--ink-mute); font-size: .9em; max-width: 68ch;
}
.kbd-row { display: flex; gap: 6px; flex-wrap: wrap; }
.kbd-lbl {
  font-size: .72em; color: var(--ink-mute);
  letter-spacing: .06em; text-transform: uppercase; margin: 4px 0 0;
}
.kbd-key {
  font: inherit; color: var(--ink);
  background: var(--ground);
  border: 1px solid var(--outline);
  border-radius: 6px;
  min-width: 56px; min-height: 48px;
  padding: 4px 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 1px;
}
.kbd-key:hover { background: #242B33; }
.kbd-key:active { transform: scale(.96); }
.kbd-key .kg { font-size: 1.15em; line-height: 1.2; }
.kbd-key .kn-big {
  font-size: .8em; letter-spacing: .02em; color: var(--ink);
  text-transform: uppercase; white-space: normal; text-align: center;
  line-height: 1.15;
}
.kbd-key { min-width: 88px; }
.kbd-key .kn {
  font-size: .55em; letter-spacing: .04em; color: var(--ink-mute);
  text-transform: uppercase; white-space: nowrap;
}
.kbd-key.dim { opacity: .45; }
.kbd-key.op { min-width: 48px; }
.kbd-seq {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline;
  border-top: 1px solid var(--frame);
  margin-top: 10px; padding-top: 8px;
  font-size: .9em;
}
.kbd-seq .chain { font-size: 1.05em; }
.kbd-seq .trans { color: var(--ink-mute); }
.kbd-seq .ok { color: var(--green-hi); font-weight: 600; }
.kbd-seq .warn { color: #E7B6B6; }

/* --- sheets ------------------------------------------------------------
   Strata Sheets — a working spreadsheet, in the console's own idiom.
   A drawer like the others: bounded, collapsed while hidden. The grid
   scrolls inside the drawer with sticky headers, so a big sheet never
   steals the transcript's room. */
.sheet {
  background: var(--surface);
  border: 1px solid var(--frame);
  border-radius: 8px;
  padding: 10px 14px;
  max-height: 46vh;
  overflow: auto;
}
.sh-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.sh-bar select, .sh-bar input[type=text] {
  font: inherit; font-size: .9em; color: var(--ink);
  background: var(--ground); border: 1px solid var(--outline);
  border-radius: 6px; padding: 8px 10px; min-height: 40px;
}
.sh-fx { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.sh-fx .sh-addr {
  font-family: ui-monospace, Consolas, monospace;
  color: var(--ink-mute); min-width: 4ch; text-align: right;
}
.sh-fx input {
  flex: 1 1 auto; min-width: 0;
  font-family: ui-monospace, Consolas, monospace; font-size: .9em;
  color: var(--ink); background: var(--ground);
  border: 1px solid var(--outline); border-radius: 6px;
  padding: 8px 10px; min-height: 40px;
}
table.sh-grid { border-collapse: collapse; }
.sh-grid th {
  font-size: .72em; color: var(--ink-mute); font-weight: 600;
  padding: 2px 6px; background: var(--surface);
}
.sh-grid thead th { position: sticky; top: 0; z-index: 2; }
.sh-grid th.rowh { position: sticky; left: 0; z-index: 1; text-align: right; }
.sh-grid td { padding: 0; border: 1px solid var(--frame); }
.sh-grid td input {
  width: 12ch; font-family: ui-monospace, Consolas, monospace;
  font-size: .85em; color: var(--ink); background: var(--ground);
  border: 0; padding: 6px 8px;
}
.sh-grid td input:focus { outline: 2px solid var(--focus); outline-offset: -2px; }
.sh-grid td input.numeric { text-align: right; }
.sh-grid td input.err { color: #E7B6B6; }
.sh-hint { color: var(--ink-mute); font-size: .82em; margin: 6px 0 0; }

/* --- read-along ------------------------------------------------------- */
.s { border-radius: 3px; transition: background-color .12s ease; }
.s.reading { background: #2E4258; box-shadow: 0 0 0 2px #2E4258; }
.w.now {
  background: #3A5570;
  border-radius: 2px;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 2px;
}
.reading-on .s { cursor: pointer; }
.reading-on .s:hover { background: #26313D; }

@media (prefers-reduced-motion: reduce) {
  .s { transition: none; }
  .streaming .body > :last-child::after { animation: none; }
}
</style>

<a class="skip" href="#msg">Skip to the message box</a>

<header class="bar" role="banner">
  <div class="brand">Strata<span>Console</span></div>
  <span class="tag">web build</span>

  <div class="grp" role="group" aria-label="Reading">
    <label class="lbl" for="font">Font</label>
    <select id="font" class="ctl">
      <option value="system">System</option>
      <option value="atkinson">Atkinson Hyperlegible</option>
      <option value="opendyslexic">OpenDyslexic</option>
      <option value="verdana">Verdana</option>
      <option value="serif">Serif</option>
    </select>
    <button id="smaller" class="ctl" type="button" aria-label="Smaller text">A&minus;</button>
    <button id="bigger" class="ctl" type="button" aria-label="Larger text">A+</button>
    <output id="size" class="size" aria-live="polite">17px</output>
  </div>

  <p id="status" class="status" role="status" aria-live="polite">Starting…</p>
  <output id="ram" class="size"
          title="JS heap this page is using — the browser build's honest stand-in for the desktop RAM readout"></output>
  <button id="avatar" class="av-btn" type="button" aria-expanded="false"
          aria-controls="av-panel" aria-label="Avatar — console state"
          title="Avatar — a live view of the console's state. Click for the full view and metrics.">
    <svg id="av-mini" viewBox="0 0 100 100" aria-hidden="true" focusable="false"></svg>
  </button>
</header>

<!-- Avatar Visualizer — full view. A drawer row like the Knowledge Base:
     bounded, and collapsed to nothing while hidden. -->
<section id="av-panel" class="av" aria-label="Avatar visualizer" hidden>
  <svg id="av-big" viewBox="0 0 100 100" aria-hidden="true" focusable="false"></svg>
  <div id="av-stats" class="av-stats"></div>
</section>

<main id="log" class="log" tabindex="0" role="log" aria-live="polite"
      aria-label="Conversation transcript"></main>

<div class="tools" role="group" aria-label="Voice and session">
  <button id="mic" class="ctl mic" type="button" aria-pressed="false">
    <span aria-hidden="true">🎤</span> Speak
  </button>
  <select id="tier" class="ctl" aria-label="Dictation accuracy" disabled
          title="Whisper tiers are a desktop feature — the browser supplies a single speech engine.">
    <option>Browser engine</option>
  </select>

  <select id="overlay" class="ctl" aria-label="Behavioral overlay"
          title="Omega-1 behavioral overlay — conditions how the assistant answers: tone, pacing, chunking. /overlay lists them."></select>
  <label class="check" for="cogload"
         title="Target cognitive load for answers — 1 is minimal (very short, one idea at a time), 10 is full depth.">
    Load&nbsp;<input type="range" id="cogload" min="1" max="10" step="1">
  </label>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════════
 * Strata Console — browser build.
 *
 * A port of the pywebview desktop shell. The shell was already HTML/CSS/
 * JS; what follows below the UI code are JavaScript ports of the Python
 * kernels the bridge used to answer for: commands.py, dictation.py,
 * speech.py, retrieval.py, context_sources.py, and the five pipeline
 * stages of strata_core.py.
 *
 * One seat changed occupants. Where the desktop engine holds a locally
 * hosted model (loopback only), this build holds a POD ASSISTANT:
 * the page asks Claude at runtime, with the viewer's permission, using
 * the same prompt structure, the same mode conditioning, and the same
 * honest fallback — when the pod assistant is unavailable, the
 * deterministic template engine answers and the UI says so.
 * ═══════════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const log = $('log');

/* ---------- operator token lexicon (strata_core.GLYPH_CODEX) ---------- */

/* Codex Glyph Legend v2 (adopted 2026-09-19, from the Strata Console v2
 * handoff). Each glyph now carries its zone, cognitive load range and
 * the AI instruction that conditions the pod assistant when the glyph
 * rides in a message. ⭕ 🔮 🤝 stay as legacy tokens so established
 * habits still classify. 🧊 Golden Source is the one the archive rule
 * honours: a 🧊 card never expires. */
const GLYPHS = [
  { glyph: '🔺', name: 'EXECUTE', fn: 'Immediate action', zone: 'GREEN', load: [1, 3],
    instr: 'The user wants immediate action; be direct and executable.' },
  { glyph: '🧊', name: 'GOLDEN_SOURCE', fn: 'Authoritative / canonical', zone: 'YELLOW', load: [2, 4],
    instr: 'Treat the referenced material as canonical and archived; it never expires.' },
  { glyph: '🔸', name: 'ANALYZE', fn: 'Review / processing', zone: 'RED', load: [4, 6],
    instr: 'This needs review: pause and structure the answer before giving it.' },
  { glyph: '🌀', name: 'ITERATE', fn: 'Growth / expansion', zone: 'VARIES', load: [3, 5],
    instr: 'Growth and expansion: suggest concrete next steps.' },
  { glyph: '🥥', name: 'COCONUT', fn: 'Joy / delight', zone: 'VARIES', load: [1, 2],
    instr: 'Coconut Protocol: add warmth and contextual humor.' },
  { glyph: '💠', name: 'CORE', fn: 'Central / essential', zone: 'GREEN', load: [2, 4],
    instr: 'A central, essential concept: keep the answer anchored to it.' },
  { glyph: '⚪', name: 'ANCHOR', fn: 'Reference point', zone: 'YELLOW', load: [1, 3],
    instr: 'A fixed reference point: do not change or reinterpret it.' },
  { glyph: '🌊', name: 'WAVE', fn: 'Uncertainty / experimentation', zone: 'RED', load: [5, 7],
    instr: 'Experimental and uncertain: hold conclusions loosely and say what is unknown.' },
  { glyph: '🎯', name: 'TARGET', fn: 'Goal / destination', zone: 'GREEN', load: [2, 5],
    instr: 'A goal: track progress toward it and say how far along things are.' },
  /* v3.8 expansion glyphs (adopted 2026-09-20, from the keyboard
   * handoff's Codex Expansion v3.8): six of the new lexicon's glyphs
   * whose meanings COEXIST with the v2 legend, adopted with real
   * instructions so they condition the pod assistant exactly like the
   * rest. The v3.8 meanings that would CONTRADICT v2 (🧊 as mere
   * stabilize, 🌊 as peace) were not adopted — one glyph, one meaning.
   * 👥 multi-agent orchestration was declined outright: this console is
   * structurally Claude-only, and a key that pretends otherwise lies. */
  { glyph: '🔷', name: 'UNITY', fn: 'Synthesis / holistic view', zone: 'YELLOW', load: [4, 6], x38: true,
    instr: 'Synthesize: draw the threads into one coherent whole and name what unifies them.' },
  { glyph: '🐍', name: 'CYCLE', fn: 'Refinement loop / eternal return', zone: 'VARIES', load: [3, 6], x38: true,
    instr: 'A refinement loop: treat this as one pass of an ongoing cycle and end with what the next pass should check.' },
  { glyph: '⚡', name: 'URGENT', fn: 'Urgency / high priority', zone: 'GREEN', load: [1, 3], x38: true,
    instr: 'High priority: answer the time-critical part first and explicitly defer the rest.' },
  { glyph: '🌳', name: 'WISDOM', fn: 'Long view / durable principles', zone: 'RED', load: [3, 5], x38: true,
    instr: 'Take the long view: ground the answer in durable principles rather than quick fixes.' },
  { glyph: '🔄', name: 'RESONANCE', fn: 'Consistency / harmonize', zone: 'YELLOW', load: [3, 5], x38: true,
    instr: 'Harmonize: keep the answer consistent with what is already established in this session.' },
  { glyph: '🔗', name: 'LINK', fn: 'Connect / thread', zone: 'VARIES', load: [2, 4], x38: true,
    instr: 'Connect: tie the answer explicitly to the related material already in play, naming it.' },
  /* legacy tokens — no v2 metadata, but they still classify and light the avatar */
  { glyph: '⭕', name: 'SENTIMENT', fn: 'Tone / sentiment (legacy)' },
  { glyph: '🔮', name: 'MAP', fn: 'Concept mapping (legacy)' },
  { glyph: '🤝', name: 'COLLABORATE', fn: 'Collaboration (legacy)' },
];

/* ---------- persistence (SQLite → localStorage, same semantics) -------
 * memory_threads + the clear floor: archive, never delete. Storage can
 * be absent or full (private windows, blocked site data), so every
 * touch is guarded and the store falls back to memory for the session. */

const store = (() => {
  let mem = { rows: [], floor: 0, state: {} };
  const load = (k, d) => {
    try { const v = localStorage.getItem('strata_' + k); return v === null ? d : JSON.parse(v); }
    catch (e) { return d; }
  };
  mem.rows = load('rows', []);
  mem.floor = load('floor', 0);
  mem.state = load('state', {});
  mem.turns = load('turns', []);
  mem.tfloor = load('tfloor', 0);
  const save = (k) => {
    try { localStorage.setItem('strata_' + k, JSON.stringify(mem[k])); } catch (e) { /* memory-only */ }
  };
  return {
    addThread(input, zone) {
      mem.rows.push({ t: new Date().toISOString(), input: String(input).slice(0, 100), zone });
      save('rows');
    },
    recentThreads(n = 3) { return mem.rows.slice(mem.floor).slice(-n); },
    threadCount() { return mem.rows.length - mem.floor; },
    archivedCount() { return mem.rows.length; },
    /* Conversation recall for the pod assistant. The desktop engine
       could hand its local model only 40-character snippets of the last
       three inputs — its small context window left no room for more. The
       pod assistant has the room, so the recent turns themselves are
       kept and sent back, still governed by the same clear floor. */
    addChatTurn(role, content) {
      const body = String(content || '').slice(0, 4000);
      if (!body) return;
      mem.turns.push({ role: role, content: body });
      if (mem.turns.length > 48) {
        const drop = mem.turns.length - 48;
        mem.turns.splice(0, drop);
        mem.tfloor = Math.max(0, mem.tfloor - drop);
        save('tfloor');
      }
      save('turns');
    },
    recallTurns(maxTurns = 12, maxChars = 16000) {
      const live = mem.turns.slice(mem.tfloor);
      const out = [];
      let total = 0;
      for (let i = live.length - 1; i >= 0 && out.length < maxTurns; i -= 1) {
        const t = live[i];
        if (!t || (t.role !== 'user' && t.role !== 'assistant') || !t.content) continue;
        total += t.content.length;
        if (total > maxChars) break;
        out.unshift({ role: t.role, content: t.content });
      }
      return out;
    },
    raiseFloor() {
      const cleared = this.threadCount();
      mem.floor = mem.rows.length;
      mem.tfloor = mem.turns.length;
      save('floor');
      save('tfloor');
      return cleared;
    },
    getState(k, d) { return (k in mem.state) ? mem.state[k] : d; },
    setState(k, v) { mem.state[k] = v; save('state'); },
  };
})();

/* ---------- pipeline stages (strata_core.py, ported) ------------------ */

function classifyInput(userInput) {            /* InputNode */
  const text = userInput.trim();
  /* Two spellings, one meaning. The keyboard types [EXECUTE]; a message
     or a stored card may still carry the retired emoji. Both resolve to
     the same operator, so retiring the pictures did not make anything
     already written unreadable. */
  const upper = text.toUpperCase();
  const hits = GLYPHS.filter(g =>
    text.includes(g.glyph) || upper.includes(tokenOf(g.glyph).toUpperCase()));
  const glyphs = hits.map(g => g.glyph);
  let residual = text;
  for (const g of hits) {
    residual = residual.split(g.glyph).join('');
    residual = residual.split(tokenOf(g.glyph)).join('');
    residual = residual.split(tokenOf(g.glyph).toUpperCase()).join('');
  }
  residual = residual.trim();

  const isCommand = text.startsWith('/');
  const glyphHeavy = glyphs.length >= 1 && residual.length <= Math.max(2, glyphs.length * 2);
  const lowered = text.toLowerCase();

  let intent;
  if (isCommand) intent = 'command';
  else if (glyphHeavy) intent = 'symbolic';
  else if (text.includes('?') ||
           /^(what|how|why|who|when|where|can |is |are |do |does )/.test(lowered)) intent = 'query';
  else intent = 'reflection';

  return {
    text: userInput, intent, isCommand, glyphs,
    glyphMeanings: glyphs.map(ch => GLYPHS.find(g => g.glyph === ch)).filter(Boolean),
    glyphHeavy, residual,
  };
}

function route(d) {                            /* RouterNode */
  if (d.intent === 'command') return 'command';
  if (d.intent === 'symbolic' || d.glyphs.length) return 'symbolic';
  if (d.intent === 'query') return 'synthesis';
  return 'reflective';
}

function retrieveContext() {                   /* MemoryNode */
  const recent = store.recentThreads(3);
  if (!recent.length) return 'No prior context — this is the opening of the session.';
  return 'Recent context → ' + recent.map(t => `[${t.zone || '?'}] ${(t.input || '').slice(0, 40)}`).join(' | ');
}

const TONES = {                                /* PersonaNode */
  GREEN:  { label: 'active',     voice: 'energized and forward-driving' },
  YELLOW: { label: 'analytical', voice: 'measured, pattern-focused, diagnostic' },
  RED:    { label: 'grounded',   voice: 'slow, careful and calm' },
};

const ROUTE_DESC = {                           /* OutputSynthNode */
  symbolic:   'Processed via the operator-token path (tokens detected).',
  synthesis:  'Processed via the analytical path (query parsed for intent).',
  reflective: 'Processed via the default reflective path.',
  command:    'Routed to the command handler.',
};
const CLOSING_BY_ZONE = { GREEN: '[mode: active]', YELLOW: '[mode: analytical]', RED: '[mode: archival]' };

function synthesizeTemplate(d, routePath, context, tone, currentZone) {
  const voice = tone.voice || 'clear';
  const label = tone.label || 'active';
  const snippet = d.text.trim().slice(0, 80);

  const summary = d.glyphs.length
    ? `Received ${d.glyphs.length} operator token(s) ${d.glyphs.map(tokenOf).join(' ')} + '${snippet}' | Intent: ${d.intent} | Mode: ${currentZone}`
    : `Input: '${snippet}' | Intent: ${d.intent} | Route: ${routePath} | Mode: ${currentZone}`;

  let description = ROUTE_DESC[routePath] || ROUTE_DESC.reflective;
  if (d.glyphMeanings.length) {
    description += ' Active tokens: ' + d.glyphMeanings.map(m => `${tokenOf(m.glyph)}=${m.fn}`).join(', ') + '.';
  }

  const comments = `[${label} tone — ${voice}] ` + (context || 'No prior context.');
  const closing = CLOSING_BY_ZONE[currentZone] || '[mode: active]';
  return { summary, description, comments, closing };
}

/* ---------- slash commands (strata_tools/commands.py, ported) --------- */

const COMMANDS = {
  status:  'Show the current mode, assistant and memory depth.',
  lexicon: 'List the operator tokens and what each one does.',
  mode:    'Switch mode: /mode green | yellow | red.',
  kb:      'Knowledge base: /kb — counts; /kb open | close | export (current tab → clipboard, full bodies).',
  avatar:  'Avatar: /avatar — open or close the full view of the console state.',
  keyboard: 'Token keyboard: /keyboard — open the on-screen keyboard (Alt+K); /keyboard close. Currently empty.',
  sheet:   'Sheets: /sheet — open or close the spreadsheet drawer; /sheet export — copy the active sheet as CSV.',
  overlay: 'Omega-1 overlays: /overlay — list modes; /overlay <name> | off.',
  find:    'Find: /find H5 — jump to a cell; /find <keywords> — search all five stores. Opens the drawer with results.',
  export:  'Export session: /export — copy a portable context package (mode, overlay, load, glyphs, recall, KB counts) to the clipboard.',
  clear:   'Clear the window and what the assistant recalls.',
  port:    'What carried over from the desktop console, and what could not.',
  help:    'Show this list.',
};
const ALIASES = { zone: 'mode', new: 'clear', kbd: 'keyboard', keys: 'keyboard', sheets: 'sheet' };

function parseCommand(text) {
  const raw = (text || '').trim();
  if (!raw.startsWith('/')) return null;
  const body = raw.slice(1).trim();
  if (!body) return { name: '', argument: '', known: false };
  const sp = body.indexOf(' ');
  let name = (sp < 0 ? body : body.slice(0, sp)).toLowerCase();
  const argument = sp < 0 ? '' : body.slice(sp + 1).trim();
  name = ALIASES[name] || name;
  return { name, argument, known: name in COMMANDS };
}

function helpText() {
  const lines = ['### Commands', ''];
  for (const [name, description] of Object.entries(COMMANDS)) {
    lines.push(`- \`/${name}\` — ${description}`);
  }
  lines.push('', 'Also accepted: ' + Object.keys(ALIASES).map(a => `\`/${a}\``).join(', ') + '.');
  return lines.join('\n');
}

function lexiconText() {
  const lines = ['### Operator token legend', ''];
  for (const g of GLYPHS) {
    lines.push(`- \`${tokenOf(g.glyph)}\`  **${g.name}** — ${g.fn}` +
      (g.zone ? ` · zone ${g.zone}` : '') +
      (g.load ? ` · load ${g.load[0]}–${g.load[1]}` : '') +
      (g.x38 ? ' · v3.8 expansion' : ''));
  }
  lines.push('', 'A glyph in a message conditions the assistant with its instruction. ' +
    'On knowledge-base cards it drives filtering, load-sorted display, and the ' +
    '30-day archive rule — 🧊 Golden Source cards never expire.');
  return lines.join('\n');
}

/* ---------- spoken punctuation (strata_tools/dictation.py, ported) ---- */

const TWO_WORD = {
  'question mark': ['?', 'close'], 'exclamation mark': ['!', 'close'],
  'exclamation point': ['!', 'close'], 'full stop': ['.', 'close'],
  'open quote': ['"', 'open'], 'close quote': ['"', 'close'],
  'open paren': ['(', 'open'], 'close paren': [')', 'close'],
  'open parenthesis': ['(', 'open'], 'close parenthesis': [')', 'close'],
  'dollar sign': ['$', 'open'], 'percent sign': ['%', 'close'],
  'new line': ['\n', 'break'], 'new paragraph': ['\n\n', 'break'],
  'tab key': ['\t', 'break'],
};
const ONE_WORD = {
  period: ['.', 'close'], comma: [',', 'close'], colon: [':', 'close'],
  semicolon: [';', 'close'], ellipsis: ['…', 'close'],
};
const MARKS = '.,!?;:';
const PRECEDENCE = '!?.;:,';

function strongest(marks) {
  for (const m of PRECEDENCE) if (marks.includes(m)) return m;
  return marks ? marks[0] : '';
}

function applyDictationCommands(text) {
  try {
    if (!text) return text || '';
    const words = text.split(/\s+/).filter(Boolean);
    const out = [];
    let needSpace = false, capNext = false, capsMode = null;
    const spaceBefore = () => { if (needSpace && out.length) out.push(' '); needSpace = false; };

    let i = 0;
    while (i < words.length) {
      const lower = words[i].toLowerCase();
      const two = words.slice(i, i + 2).map(w => w.toLowerCase()).join(' ');
      const three = words.slice(i, i + 3).map(w => w.toLowerCase()).join(' ');

      if (three === 'all caps on')  { capsMode = 'upper'; i += 3; continue; }
      if (three === 'all caps off') { capsMode = null;    i += 3; continue; }
      if (two === 'caps on')  { capsMode = 'title'; i += 2; continue; }
      if (two === 'caps off') { capsMode = null;    i += 2; continue; }
      if (lower === 'cap')    { capNext = true;     i += 1; continue; }

      let spec = (i + 1 < words.length) ? TWO_WORD[two] : undefined;
      let step = 2;
      if (!spec) { spec = ONE_WORD[lower]; step = 1; }
      if (spec) {
        const [symbol, kind] = spec;
        if (kind === 'open') { spaceBefore(); out.push(symbol); needSpace = false; }
        else if (kind === 'break') { out.push(symbol); needSpace = false; }
        else { out.push(symbol); needSpace = true; }
        i += step;
        continue;
      }

      let word = words[i];
      if (capNext) { word = word.charAt(0).toUpperCase() + word.slice(1); capNext = false; }
      else if (capsMode === 'title') word = word.charAt(0).toUpperCase() + word.slice(1);
      else if (capsMode === 'upper') word = word.toUpperCase();
      spaceBefore(); out.push(word); needSpace = true;
      i += 1;
    }
    return out.join('');
  } catch (e) { return text; }
}

function dedupPunctuation(text) {
  try {
    if (!text) return text || '';
    let r = text;
    r = r.replace(/[.,!?;:]+(?:[ \t]*[.,!?;:]+)*/g,
      (m) => strongest([...m].filter(c => MARKS.includes(c)).join('')));
    r = r.replace(/[ \t]+([.,!?;:])/g, '$1');
    r = r.replace(/(?<!\d)([.,!?;:])[ \t]*(?=[^\s\d.,!?;:])/g, '$1 ');
    return r;
  } catch (e) { return text; }
}

function polish(text) {
  try { return dedupPunctuation(applyDictationCommands(text)); }
  catch (e) { return text; }
}

/* ---------- speakable (strata_tools/speech.py, ported) ---------------- */

const ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten',
  'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
const ABBREV = [
  ['Mr.','Mister'], ['Mrs.','Missus'], ['Ms.','Miss'], ['Dr.','Doctor'],
  ['Prof.','Professor'], ['Jr.','Junior'], ['Sr.','Senior'], ['St.','Saint'],
  ['vs.','versus'], ['etc.','et cetera'], ['e.g.','for example'],
  ['i.e.','that is'], ['approx.','approximately'],
];
const ORDINAL_IRREGULAR = {
  one: 'first', two: 'second', three: 'third', five: 'fifth',
  eight: 'eighth', nine: 'ninth', twelve: 'twelfth',
};

function intToWords(n) {
  if (n < 0) return 'negative ' + intToWords(-n);
  if (n < 20) return ONES[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
  const parts = [];
  for (const [value, name] of [[1e9, 'billion'], [1e6, 'million'], [1e3, 'thousand']]) {
    if (n >= value) { parts.push(intToWords(Math.floor(n / value)) + ' ' + name); n %= value; }
  }
  if (n >= 100) { parts.push(ONES[Math.floor(n / 100)] + ' hundred'); n %= 100; }
  if (n) parts.push(intToWords(n));
  return parts.join(' ');
}

function ordinalize(words) {
  const cut = words.lastIndexOf('-');
  let head = cut < 0 ? '' : words.slice(0, cut);
  let last = cut < 0 ? words : words.slice(cut + 1);
  if (last in ORDINAL_IRREGULAR) last = ORDINAL_IRREGULAR[last];
  else if (last.endsWith('y')) last = last.slice(0, -1) + 'ieth';
  else last = last + 'th';
  return head ? head + '-' + last : last;
}

function decimalToWords(token) {
  token = token.split(',').join('');
  if (token.includes('.')) {
    const [whole, frac] = token.split('.');
    const wholeWords = whole ? intToWords(parseInt(whole, 10)) : 'zero';
    const digits = [...frac].filter(d => /\d/.test(d)).map(d => ONES[+d]).join(' ');
    return (wholeWords + ' point ' + digits).trim();
  }
  return intToWords(parseInt(token, 10));
}

function yearToWords(year) {
  if (year >= 2000 && year <= 2009) {
    return year === 2000 ? 'two thousand' : 'two thousand ' + intToWords(year - 2000);
  }
  const hi = Math.floor(year / 100), lo = year % 100;
  if (lo === 0) return intToWords(hi) + ' hundred';
  if (lo < 10) return intToWords(hi) + ' oh ' + ONES[lo];
  return intToWords(hi) + ' ' + intToWords(lo);
}

const FENCE_SPOKEN = '(code block)';

function stripMarkdown(text) {
  try {
    if (!text) return text || '';
    let out = text;
    out = out.replace(/```[^\n]*\n[\s\S]*?(?:```|$)/g, FENCE_SPOKEN + '. ');
    out = out.replace(/^\s*\|[\s:|-]+\|\s*$/gm, '');
    out = out.replace(/^\s*\|.*\|\s*$/gm,
      (m) => m.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()).join(' ') + '.');
    out = out.replace(/^\s{0,3}(?:[-*_]\s*){3,}$/gm, '');
    out = out.replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1');
    out = out.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
    out = out.replace(/^\s{0,3}#{1,6}\s+/gm, '');
    out = out.replace(/^\s{0,3}>\s?/gm, '');
    out = out.replace(/^(\s*)[-*+]\s+/gm, '$1');
    for (let i = 0; i < 3; i++) {
      out = out.replace(/(\*{1,3}|_{1,3})(\S(?:[\s\S]*?\S)?)\1/g, '$2');
    }
    out = out.replace(/\n{3,}/g, '\n\n');
    return out.trim();
  } catch (e) { return text; }
}

function normalizeCodeSpan(code) {
  return code.split('_').join(' underscore ').split('/').join(' slash ').trim();
}

function normalizeProse(text) {
  let out = text;
  for (const [abbr, full] of ABBREV) out = out.split(abbr).join(full);
  out = out.replace(/\$(\d[\d,]*)(\.\d{1,2})?/g, (m, whole, cents) => {
    const w = parseInt(whole.split(',').join(''), 10);
    let s = intToWords(w) + (w === 1 ? ' dollar' : ' dollars');
    if (cents) {
      const c = Math.round(parseFloat('0' + cents) * 100);
      if (c) s += ' and ' + intToWords(c) + (c === 1 ? ' cent' : ' cents');
    }
    return s;
  });
  out = out.replace(/(\d[\d,]*(?:\.\d+)?)\s*%/g, (m, num) => decimalToWords(num) + ' percent');
  out = out.replace(/\b(\d+)(?:st|nd|rd|th)\b/g, (m, num) => ordinalize(intToWords(parseInt(num, 10))));
  out = out.replace(/\b(1\d{3}|20\d{2})\b/g, (m, y) => yearToWords(parseInt(y, 10)));
  out = out.replace(/\b\d[\d,]*(?:\.\d+)?\b/g, (m) => decimalToWords(m));
  return out;
}

function normalizeForSpeech(text) {
  try {
    if (!text) return text || '';
    const parts = text.split(/`([^`\n]+)`/);
    return parts.map((seg, i) => i % 2 ? normalizeCodeSpan(seg) : normalizeProse(seg)).join('');
  } catch (e) { return text; }
}

function speakable(text) {
  try { return normalizeForSpeech(stripMarkdown(text)); }
  catch (e) { return text; }
}

/* ---------- retrieval (strata_tools/retrieval.py, ported) ------------- */

function terms(query) {
  return ((query || '').toLowerCase().match(/[a-z0-9]+/g) || []).filter(w => w.length > 2);
}

function scoreText(text, ts) {
  if (!ts.length) return 0;
  const t = (text || '').toLowerCase();
  return ts.reduce((sum, w) => sum + (t.split(w).length - 1), 0);
}

function chunkText(text, chunkChars = 1200, overlap = 150) {
  text = text || '';
  if (!text.trim()) return [];
  if (text.length <= chunkChars) return [text];
  const step = Math.max(1, chunkChars - overlap);
  const chunks = [];
  for (let start = 0; start < text.length; start += step) {
    const piece = text.slice(start, start + chunkChars);
    if (piece.trim()) chunks.push(piece);
    if (start + chunkChars >= text.length) break;
  }
  return chunks;
}

function retrieveFromText(query, text, limit = 4, chunkChars = 1200, overlap = 150, maxContext = 6000) {
  if (!text) return '';
  const chunks = chunkText(text, chunkChars, overlap);
  if (!chunks.length) return '';
  const ts = terms(query);
  const scored = chunks.map((c, i) => [scoreText(c, ts), i, c.slice(0, chunkChars)])
    .filter(x => x[0] > 0)
    .sort((a, b) => b[0] - a[0])
    .slice(0, limit);
  if (!scored.length) return text.slice(0, maxContext);
  const out = [];
  let total = 0;
  for (const [, , snipRaw] of scored) {
    if (total >= maxContext) break;
    let snip = snipRaw;
    if (total + snip.length > maxContext) snip = snip.slice(0, maxContext - total);
    out.push(snip);
    total += snip.length;
  }
  return out.join('\n…\n');
}

/* ---------- context sources (strata_tools/context_sources.py) --------- */

const TRIGGER_PHRASES = [
  'search the web', 'search the internet', 'search online', 'web search',
  'look online', 'look this up', 'look up online', 'check the internet',
  'check online', 'google ', 'on the internet', 'search for', 'do a search',
  'look up', 'find out', 'latest news', 'current news', "what's the latest",
  'browse the web', 'web browse',
];
const MAX_ATTACHMENT_CHARS = 2000000;

function wantsWeb(userInput) {
  const low = (userInput || '').toLowerCase();
  return TRIGGER_PHRASES.some(p => low.includes(p));
}

function attachmentContext(query, att) {
  if (!att) return '';
  const body = retrieveFromText(query, att.text || '');
  if (!body) return '';
  return `From the attached file '${att.name || 'file'}':\n` + body;
}

function attachmentLabel(name, nChars) {
  const kb = Math.max(1, Math.floor(nChars / 1024));
  return `📎 ${name} (${kb} KB) — attached; Remove detaches it`;
}

function busyLabel(hasAttachment, firstPodCall, hasImage) {
  if (firstPodCall) return 'first message — your browser asks permission for the pod assistant';
  if (hasImage) return '🔎 looking at the image…';
  if (hasAttachment) return '🔎 reading the attachment…';
  return 'thinking (pod assistant)…';
}

/* ---------- knowledge base (Study Workstation, integrated) -------------
 * The Sentinel Forge Study Workstation's stores — Library, note Cards,
 * Notes, Journal, Glossary — now resident in the console under their own
 * key (strata_kb_v1), fully separate from the conversation stores, so
 * neither can touch the other. The pod assistant reads them the way it
 * reads every source: the page searches, ranks and hands passages in.
 * It can also WRITE to them, through tools this page defines — every
 * write is applied locally, logged, and reported in the transcript. */

const kb = (() => {
  const KEY = 'strata_kb_v1';
  const blank = () => ({ documents: [], cards: [], notes: [], journal: [], glossary: [], log: [] });
  let data = blank();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) data = Object.assign(blank(), JSON.parse(raw));
  } catch (e) { data = blank(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* memory-only */ } };
  const uid = (p) => p + '-' + Math.random().toString(36).slice(2, 8) + '-' + Date.now().toString(36);
  const logIt = (text) => {
    data.log.unshift({ at: Date.now(), text: String(text).slice(0, 160) });
    data.log = data.log.slice(0, 100);
  };
  const okCoord = (c) => /^[A-Z]\d{1,3}$/.test(c) && parseInt(c.slice(1), 10) >= 1;
  return {
    get data() { return data; },
    addDocument(title, body) {
      const d = { id: uid('d'), title: String(title || 'Untitled document').slice(0, 200),
                  body: String(body || ''), at: Date.now() };
      data.documents.unshift(d); logIt('Added document: ' + d.title); save(); return d;
    },
    addCard(o) {
      o = o || {};
      const raw = String(o.coord || '').toUpperCase();
      const load = Math.round(Number(o.load));
      const g = String(o.glyph || '').trim();
      const c = {
        id: uid('c'), title: String(o.title || 'Untitled card').slice(0, 200),
        body: String(o.body || ''),
        coord: okCoord(raw) ? raw : 'D3',
        zone: ['GREEN', 'YELLOW', 'RED'].includes(o.zone) ? o.zone : 'GREEN',
        glyph: GLYPHS.some((gl) => gl.glyph === g) ? g : '',
        glyphHistory: [],   // audit trail: every glyph this card has worn
        links: [],          // relationships to other cards, by id
        load: (load >= 1 && load <= 10) ? load : 5,
        byAssistant: !!o.byAssistant, reason: String(o.reason || '').slice(0, 200),
        at: Date.now(),
      };
      data.cards.unshift(c);
      logIt((c.byAssistant ? 'Assistant created' : 'Created') + ' card: ' + c.title);
      save(); return c;
    },
    addNote(title, body, byAssistant) {
      const n = { id: uid('n'), title: String(title || 'Note').slice(0, 200),
                  body: String(body || ''), byAssistant: !!byAssistant, at: Date.now() };
      data.notes.unshift(n);
      logIt((byAssistant ? 'Assistant saved' : 'Saved') + ' note: ' + n.title);
      save(); return n;
    },
    addJournal(body, byAssistant) {
      const j = { id: uid('j'), body: String(body || ''), byAssistant: !!byAssistant, at: Date.now() };
      data.journal.unshift(j);
      logIt((byAssistant ? 'Assistant added' : 'Added') + ' a journal entry');
      save(); return j;
    },
    addTerm(term, definition, byAssistant) {
      const g = { id: uid('g'), term: String(term || 'Term').slice(0, 120),
                  definition: String(definition || ''), byAssistant: !!byAssistant, at: Date.now() };
      data.glossary.unshift(g);
      logIt((byAssistant ? 'Assistant defined' : 'Defined') + ' term: ' + g.term);
      save(); return g;
    },
    remove(kind, id) {
      const list = data[kind];
      if (!Array.isArray(list)) return false;
      const i = list.findIndex((x) => x.id === id);
      if (i < 0) return false;
      const gone = list.splice(i, 1)[0];
      logIt('Deleted ' + kind.replace(/s$/, '') + ': ' +
        (gone.title || gone.term || String(gone.body || '').slice(0, 40)));
      save(); return true;
    },
    /* Spec 2: change a card's glyph, recording the OLD glyph in the
       card's history first — an audit trail, so no glyph is ever lost,
       only superseded. Migration is lazy: legacy cards grow their
       history array on first touch. */
    applyGlyph(id, glyph, context, byAssistant) {
      const c = data.cards.find((x) => x.id === id);
      if (!c) return null;
      const g = String(glyph || '').trim();
      if (!GLYPHS.some((x) => x.glyph === g)) return null;
      if (!Array.isArray(c.glyphHistory)) c.glyphHistory = [];
      c.glyphHistory.push({ glyph: c.glyph || '', at: Date.now(),
        by: byAssistant ? 'assistant' : 'user',
        context: String(context || '').slice(0, 160) });
      c.glyph = g;
      logIt((byAssistant ? 'Assistant changed' : 'Changed') +
            ' glyph on "' + c.title + '" to ' + g);
      save();
      return c;
    },
    /* Spec 2: link two cards. Directed edge, stored on the source. */
    linkCards(id, targetId, type, byAssistant) {
      const c = data.cards.find((x) => x.id === id);
      const t = data.cards.find((x) => x.id === targetId);
      if (!c || !t || c.id === t.id) return null;
      const kinds = ['blocks', 'depends_on', 'references', 'child_of', 'related_to'];
      const k = kinds.includes(type) ? type : 'related_to';
      if (!Array.isArray(c.links)) c.links = [];
      if (c.links.some((l) => l.target === t.id && l.type === k)) return c;  // idempotent
      c.links.push({ target: t.id, type: k });
      logIt((byAssistant ? 'Assistant linked' : 'Linked') +
            ' "' + c.title + '" ' + k.replace('_', ' ') + ' "' + t.title + '"');
      save();
      return c;
    },
    /* The lifecycle pass, run at startup. Two rules, in order:
       1. Glyph decay (spec 2): 🎯 Target older than 7 days softens to
          🌀 Iterate — recorded in the card's history as a system change.
       2. The v2 expiry rule: a card older than 30 days moves to the RED
          zone — archived, exactly as the clear floor treats conversation.
       🧊 Golden Source is exempt from BOTH, and nothing is deleted:
       changing zone or glyph back revives the card. */
    autoArchive(maxAgeDays = 30) {
      const DECAY = { '🎯': { afterDays: 7, to: '🌀' } };
      const now = Date.now();
      let archived = 0;
      let decayed = 0;
      data.cards.forEach((c) => {
        if (c.glyph === '🧊' || !c.at) return;
        const rule = DECAY[c.glyph];
        if (rule && c.at < now - rule.afterDays * 86400000) {
          if (!Array.isArray(c.glyphHistory)) c.glyphHistory = [];
          c.glyphHistory.push({ glyph: c.glyph, at: now, by: 'system',
            context: 'decay after ' + rule.afterDays + ' days' });
          c.glyph = rule.to;
          decayed += 1;
        }
        if (c.zone !== 'RED' && c.at < now - maxAgeDays * 86400000) {
          c.zone = 'RED';
          archived += 1;
        }
      });
      if (archived || decayed) {
        logIt('Lifecycle pass: ' + decayed + ' glyph decay(s), ' +
              archived + ' card(s) archived to RED');
        save();
      }
      return { archived, decayed };
    },
    counts() {
      return { documents: data.documents.length, cards: data.cards.length,
               notes: data.notes.length, journal: data.journal.length,
               glossary: data.glossary.length };
    },
    total() {
      const c = this.counts();
      return c.documents + c.cards + c.notes + c.journal + c.glossary;
    },
  };
})();

/* Search every KB store with the console's own retrieval kernel:
 * documents are chunk-ranked exactly like attachments; cards, notes,
 * journal entries and glossary terms score whole, since each is already
 * a small unit. Same terms() and scoreText() as everything else — one
 * retrieval engine, five more places it looks. */
function kbSearch(query, limit = 8) {
  const ts = terms(query);
  if (!ts.length) return [];
  const hits = [];
  const push = (kind, id, title, text, extraFields) => {
    const s = scoreText(title + ' ' + text, ts);
    if (s > 0) hits.push(Object.assign({ kind, id, title, text, score: s }, extraFields || {}));
  };
  kb.data.documents.forEach((d) => push('document', d.id, d.title, d.body));
  kb.data.cards.forEach((c) => push('card', c.id, c.title, c.body, { coord: c.coord, zone: c.zone, glyph: c.glyph || '' }));
  kb.data.notes.forEach((n) => push('note', n.id, n.title, n.body));
  kb.data.journal.forEach((j) => {
    let day = '';
    try { day = new Date(j.at).toLocaleDateString(); } catch (e) { /* untitled */ }
    push('journal', j.id, 'Journal ' + day, j.body);
  });
  kb.data.glossary.forEach((g) => push('term', g.id, g.term, g.definition));
  hits.sort((a, b) => b.score - a.score);
  return hits.slice(0, limit);
}

function kbContext(query, maxChars = 4000) {
  const hits = kbSearch(query, 8);
  if (!hits.length) return { text: '', names: [] };
  const parts = [];
  const names = [];
  let total = 0;
  for (const h of hits) {
    if (total >= maxChars) break;
    const body = h.kind === 'document'
      ? retrieveFromText(query, h.text, 3, 1200, 150, 1800)
      : h.text.slice(0, 900);
    if (!body) continue;
    const head = h.kind === 'card'
      ? (h.glyph ? h.glyph + ' ' : '') + "card '" + h.title + "' at " + h.coord + ' [' + h.zone + ']'
      : h.kind + " '" + h.title + "'";
    let piece = "From the user's knowledge base — " + head + ':\n' + body;
    if (total + piece.length > maxChars) piece = piece.slice(0, maxChars - total);
    parts.push(piece);
    total += piece.length;
    if (names.length < 4) names.push(h.title);
  }
  return { text: parts.join('\n\n'), names: names };
}

/* Find one card by cell address or title fragment — shared by the
 * assistant's card tools. Cell match wins; otherwise the first
 * case-insensitive title match. */
function kbFindCard(q) {
  const s = String(q || '').trim();
  if (!s) return null;
  if (/^[A-Za-z]\d{1,3}$/.test(s)) {
    const hit = kb.data.cards.find((c) => c.coord === s.toUpperCase());
    if (hit) return hit;
  }
  const low = s.toLowerCase();
  return kb.data.cards.find((c) => (c.title || '').toLowerCase().includes(low)) || null;
}

/* Tools the pod assistant may call. Each one executes HERE, on the KB
 * stores in this browser — nowhere else — and pushes a plain-language
 * record into `actions` so the turn can report what was done. */
function kbAssistantTools(actions) {
  return [
    { name: 'searchKnowledgeBase',
      description: "Search the user's own knowledge base — library documents, note cards, notes, journal, glossary — by keywords. Returns ranked hits with kind, title, cell/zone where present, and a passage. Use it whenever the question might touch the user's own material.",
      inputSchema: { type: 'object',
        properties: { query: { type: 'string', description: 'keywords to look up' } },
        required: ['query'] },
      execute: (a) => kbSearch(String((a && a.query) || ''), 8).map((h) => ({
        kind: h.kind, title: h.title, coord: h.coord || '', zone: h.zone || '',
        passage: h.kind === 'document'
          ? retrieveFromText(String((a && a.query) || ''), h.text, 2, 1200, 150, 1200)
          : h.text.slice(0, 600),
      })) },
    { name: 'createCard',
      description: "Create a note card in the user's knowledge base. coord is a cell A1–Z999 (defaults to D3); zone is GREEN, YELLOW or RED; load is cognitive load 1–10; glyph is an optional codex glyph character (🔺 Execute, 🧊 Golden Source — never auto-archives, 🔸 Analyze, 🌀 Iterate, 🥥 Coconut, 💠 Core, ⚪ Anchor, 🌊 Wave, 🎯 Target). Always pass a one-sentence reason for the cell you chose.",
      inputSchema: { type: 'object',
        properties: { title: { type: 'string' }, body: { type: 'string' },
          coord: { type: 'string' }, zone: { type: 'string' },
          load: { type: 'number' }, glyph: { type: 'string' },
          reason: { type: 'string' } },
        required: ['title'] },
      execute: (a) => {
        const c = kb.addCard(Object.assign({}, a, { byAssistant: true }));
        actions.push('card "' + c.title + '" at ' + c.coord);
        kbRender();
        return { ok: true, id: c.id, coord: c.coord };
      } },
    { name: 'changeCardGlyph',
      description: "Change the codex glyph on an existing card, recording the old glyph in the card's history (an audit trail — nothing is lost). Identify the card by its cell (e.g. H5) or a distinctive title fragment. Pass a one-sentence context saying why.",
      inputSchema: { type: 'object',
        properties: { card: { type: 'string', description: 'cell like H5, or title fragment' },
          glyph: { type: 'string' }, context: { type: 'string' } },
        required: ['card', 'glyph'] },
      execute: (a) => {
        const found = kbFindCard(a && a.card);
        if (!found) throw new Error('No card matched — call searchKnowledgeBase first and use the exact cell or title.');
        const c = kb.applyGlyph(found.id, a && a.glyph, a && a.context, true);
        if (!c) throw new Error('That glyph is not in the legend.');
        actions.push('glyph ' + c.glyph + ' on "' + c.title + '"');
        kbRender();
        return { ok: true, title: c.title, glyph: c.glyph, historyLength: c.glyphHistory.length };
      } },
    { name: 'linkCards',
      description: "Link one card to another in the user's knowledge base. type is one of: blocks, depends_on, references, child_of, related_to. Identify each card by cell (e.g. H5) or a distinctive title fragment. Link only when the user asks for it or clearly wants two cards connected.",
      inputSchema: { type: 'object',
        properties: { from: { type: 'string' }, to: { type: 'string' },
          type: { type: 'string' } },
        required: ['from', 'to'] },
      execute: (a) => {
        const src = kbFindCard(a && a.from);
        const dst = kbFindCard(a && a.to);
        if (!src || !dst) throw new Error('Could not match ' + (!src ? 'the "from"' : 'the "to"') + ' card — use searchKnowledgeBase and pass the exact cell or title.');
        const c = kb.linkCards(src.id, dst.id, a && a.type, true);
        if (!c) throw new Error('The link could not be made (a card cannot link to itself).');
        actions.push('"' + src.title + '" → "' + dst.title + '"');
        kbRender();
        return { ok: true, from: src.title, to: dst.title, linkCount: c.links.length };
      } },
    { name: 'saveNote',
      description: "Save a note in the user's knowledge base.",
      inputSchema: { type: 'object',
        properties: { title: { type: 'string' }, body: { type: 'string' } },
        required: ['body'] },
      execute: (a) => {
        const n = kb.addNote(a && a.title, a && a.body, true);
        actions.push('note "' + n.title + '"');
        kbRender();
        return { ok: true, id: n.id };
      } },
    { name: 'addJournalEntry',
      description: "Add a journal entry to the user's knowledge base — what happened or what was learned this session.",
      inputSchema: { type: 'object',
        properties: { body: { type: 'string' } }, required: ['body'] },
      execute: (a) => {
        const j = kb.addJournal(a && a.body, true);
        actions.push('journal entry');
        kbRender();
        return { ok: true, id: j.id };
      } },
    { name: 'addGlossaryTerm',
      description: "Add a term and its definition to the user's glossary.",
      inputSchema: { type: 'object',
        properties: { term: { type: 'string' }, definition: { type: 'string' } },
        required: ['term', 'definition'] },
      execute: (a) => {
        const g = kb.addTerm(a && a.term, a && a.definition, true);
        actions.push('term "' + g.term + '"');
        kbRender();
        return { ok: true, id: g.id };
      } },
  ];
}

/* ---------- transcript ------------------------------------------------ */

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* A deliberately small markdown renderer (ported from the desktop web
 * shell). Everything is escaped first, so no assistant output can inject
 * markup — the reply is data, never trusted as HTML. */
function markdown(src) {
  const blocks = [];
  let text = esc(src).replace(/```([\s\S]*?)(?:```|$)/g, (_m, code) => {
    blocks.push(code.replace(/^[^\n]*\n/, ''));
    return ' BLOCK' + (blocks.length - 1) + ' ';
  });

  text = text
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*\*(\S(?:[\s\S]*?\S)?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(\S(?:[\s\S]*?\S)?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*(\S(?:[^*]*?\S)?)\*/g, '$1<em>$2</em>');

  const out = [];
  let list = null;
  const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };

  for (const raw of text.split('\n')) {
    const line = raw.trimEnd();
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
    const number = line.match(/^\s*\d+[.)]\s+(.*)$/);
    const quote = line.match(/^\s*>\s?(.*)$/);

    if (bullet || number) {
      const want = bullet ? 'ul' : 'ol';
      if (list !== want) { closeList(); out.push('<' + want + '>'); list = want; }
      out.push('<li>' + (bullet || number)[1] + '</li>');
    } else if (heading) {
      closeList();
      out.push('<h3>' + heading[2] + '</h3>');
    } else if (quote) {
      closeList();
      out.push('<blockquote>' + quote[1] + '</blockquote>');
    } else if (line.trim() === '') {
      closeList();
    } else {
      closeList();
      out.push('<p>' + line + '</p>');
    }
  }
  closeList();

  return out.join('').replace(/ BLOCK(\d+) /g,
    (_m, i) => '<pre><code>' + blocks[Number(i)] + '</code></pre>');
}

function turn(who, body, cls) {
  const el = document.createElement('article');
  el.className = 'turn ' + (cls || '');
  el.innerHTML = '<div class="who">' + esc(who) + '</div>' +
                 '<div class="body">' + body + '</div>';
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function note(text, bad) {
  const el = document.createElement('p');
  el.className = 'note' + (bad ? ' bad' : '');
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

/* The spec's lookup contract: cell, else the glyph's reflection_mode
 * row, else null (legacy tokens have no matrix rows and keep their
 * plain instructions). */
function glyphModeBehavior(glyph, mode) {
  const row = GLYPH_MODE_MATRIX[glyph];
  if (!row) return null;
  return row[mode] || row.reflection_mode || null;
}

let overlayMode = store.getState('overlay', 'off');
if (!(overlayMode in OVERLAYS)) overlayMode = 'off';
let cogLoad = parseInt(store.getState('cog_load', '5'), 10);
if (!(cogLoad >= 1 && cogLoad <= 10)) cogLoad = 5;

/* The logical turn clock (H6, the honest kernel): a monotonic counter,
 * persisted, incremented once per dispatched turn — a Lamport clock,
 * trivially exact with a single writer. It gives every answer a total
 * order that survives reloads, which is what "time-folded ordering"
 * actually needs at one site. */
let turnClock = parseInt(store.getState('turn_clock', '0'), 10) || 0;

/* ---------- crisis session lifecycle (Spec 4, manual-only) -------------
 * Crisis Triage is activated by the USER — the dropdown or /overlay —
 * and never by the console: no keyword scoring, no automatic switching.
 * What formalization adds is the session around the mode: a start entry
 * in the journal, the load dial eased to 3 (a starting point, not a
 * lock — the dial stays yours), a gentle check-in every 30 minutes that
 * requires nothing, an end entry with the elapsed time, and support
 * resources named plainly at the start, because a productivity tool
 * should know what it is not. */
let crisisSession = null;   // { startedAt, timer } while crisis_triage is on

function crisisEnter(resumed) {
  crisisSession = { startedAt: Date.now(), timer: null };
  if (cogLoad > 3) {
    cogLoad = 3;
    store.setState('cog_load', '3');
    if ($('cogload')) { $('cogload').value = 3; $('cogload-out').value = '3/10'; }
  }
  if (resumed) {
    /* The overlay survived a reload: keep the session going quietly —
       no duplicate journal entry, no repeated speech. */
    note('🛟 Crisis Triage is still on from before the reload — ' +
         '/overlay safe_mode whenever you are ready to shift down.');
  } else {
    kb.addJournal('[CRISIS] 🔺 Session started ' + new Date().toISOString() +
      ' — crisis_triage on, one thing at a time.', true);
    note('🛟 Crisis Triage on. One thing at a time — everything else can wait. ' +
         'The load dial is set to 3 (raise it any time; it stays yours). A ' +
         'gentle check-in comes in 30 minutes. And if this is more than task ' +
         'overload, real people can help: in the US, call or text 988 ' +
         '(Suicide & Crisis Lifeline), or text HOME to 741741.');
  }
  const checkIn = () => {
    if (!crisisSession) return;
    const mins = Math.round((Date.now() - crisisSession.startedAt) / 60000);
    note('🛟 ' + mins + ' minutes in Crisis Triage. Still with it? Keep going ' +
         'as long as you need — or /overlay safe_mode when you are ready to ' +
         'shift down. Nothing is required.');
    crisisSession.timer = setTimeout(checkIn, 30 * 60000);
  };
  crisisSession.timer = setTimeout(checkIn, 30 * 60000);
}

function crisisExit() {
  if (!crisisSession) return;
  const mins = Math.round((Date.now() - crisisSession.startedAt) / 60000);
  if (crisisSession.timer) clearTimeout(crisisSession.timer);
  crisisSession = null;
  kb.addJournal('[CRISIS] 🔺 Session ended ' + new Date().toISOString() +
    ' — ' + mins + ' minute(s) elapsed. Exited by the user.', true);
  note('🛟 Crisis Triage off after ' + mins + ' minute(s) — logged to the journal.');
}

/* The ONE way the overlay changes — dropdown and /overlay both land
 * here, so the crisis lifecycle can never be bypassed or double-run. */
function setOverlay(next) {
  const key = (next in OVERLAYS) ? next : 'off';
  if (key === overlayMode) return;
  const prev = overlayMode;
  overlayMode = key;
  store.setState('overlay', overlayMode);
  if ($('overlay')) $('overlay').value = overlayMode;
  if (prev === 'crisis_triage') crisisExit();
  if (overlayMode === 'crisis_triage') {
    crisisEnter();
  } else {
    note(overlayMode === 'off'
      ? 'Overlay off — zone conditioning alone.'
      : OVERLAYS[overlayMode].label + ' overlay on — ' + OVERLAYS[overlayMode].blurb + '.');
  }
}

function changeZone(next) {
  const up = String(next || '').trim().toUpperCase();
  if (up in TONES) {
    zone = up;
    store.setState('current_zone', zone);   // persists across restarts
    return 'Mode changed to ' + zone;
  }
  return 'Invalid mode. Use: Green, Yellow, or Red';
}

function setZone(z) {
  document.querySelectorAll('.mode').forEach((b) => {
    b.setAttribute('aria-checked', b.dataset.zone === z ? 'true' : 'false');

}

 * the desktop. Same shape: available or not, honest fallback when not.
 * The viewer's browser asks permission on the first call, and the call
 * spends the viewer's own usage — never called except on Send. */

let pod;                     // undefined = checking, null = unavailable, fn = ready

const podReady = (window.claude && typeof window.claude.use === 'function')

let imageCaps = null;        // limits().images when this view can send images
const capsReady = podReady.then((fn) => {

let mcp;                     // undefined = checking, null = unavailable
const mcpReady = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('mcp').then((ns) => { mcp = ns || null; return mcp; })
      .catch(() => { mcp = null; return null; })
  : Promise.resolve(null).then(() => { mcp = null; return null; });

const DRIVE_SERVER = 'Google Drive';

/* The downloads capability — the only way a page in the artifact viewer
 * can hand the viewer a file (a plain anchor download is silently
 * ignored there). Same posture as the pod and the bridge: available or
 * not, honest when not. */
let dls;                     // undefined = checking, null = unavailable
const dlsReady = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('downloads').then((ns) => { dls = ns || null; return dls; })
      .catch(() => { dls = null; return null; })

function driveQuery(userText) {
  const ts = terms(userText).slice(0, 6);
  if (!ts.length) return null;
  return ts.map((w) => `fullText contains '${w}'`).join(' or ');
}

async function driveContext(userText) {
  const q = driveQuery(userText);
  if (!q) return { text: '', names: [] };
  const res = await mcp.callTool(DRIVE_SERVER, 'search_files',
    { query: q, pageSize: 5, snippetVerbosity: 'BRIEF' },
    { cache: { staleTime: 60000 } });
  const files = (res && res.payload && res.payload.files) || [];
  if (!files.length) return { text: '', names: [] };

  const ts = terms(userText);
  const ranked = files
    .map((f) => ({
      id: f.id,
      name: f.title || 'file',
      score: scoreText((f.title || '') + ' ' + (f.contentSnippet || ''), ts),
    }))
    .filter((f) => f.id)
    .sort((a, b) => b.score - a.score)
    .slice(0, 2);

  const parts = [];
  const names = [];
  for (const f of ranked) {
    try {
      const r = await mcp.callTool(DRIVE_SERVER, 'read_file_content',
        { fileId: f.id }, { cache: { staleTime: 60000 } });
      const body = r && r.payload && r.payload.fileContent;
      if (!body) continue;
      const passage = retrieveFromText(userText, String(body), 4, 1200, 150, 2500);
      if (!passage) continue;
      parts.push(`From the user's Google Drive file '${f.name}':\n` + passage);
      names.push(f.name);
    } catch (e) { /* one unreadable file must not sink the turn */ }
  }
  return { text: parts.join('\n\n'), names: names };
}

/* Each failure code has a different correct fix — say which. Shared by
   every connector-backed source. */
function connectorErrorNote(name, e) {
  const code = (e && e.code) || 'upstream_error';
  if (code === 'server_not_connected') {
    return `No ${name} connector for this account — add ${name} under ` +
           'Settings → Connectors in claude.ai, then try again.';
  }
  if (code === 'needs_reauth') {
    return `${name} needs reconnecting — Settings → Connectors in claude.ai.`;
  }
  if (code === 'not_in_manifest') {
    return `${name} access was declined for this page, so it does nothing ` +
           'in this view. Reload to be asked again.';
  }
  if (code === 'selection_required') {
    return `More than one ${name} is connected — choose one in the prompt, ` +
           'then try again.';
  }
  if (e && e.retryable) {
    return `${name} did not answer just now — worth one more try in a moment.`;
  }
  return `${name} error (${code}) — answering without it.`;
}

function runCommand(text) {
  const c = parseCommand(text);
  if (c === null) return { handled: false };
  if (!c.known) {
    return { handled: true, message: `Unknown command: ${text.trim()}. Try /help`, bad: true };
  }
  switch (c.name) {
    case 'status':
      return { handled: true, markdown: true, message: statusText(), status: getStatus() };
    case 'lexicon':
      return { handled: true, markdown: true, message: lexiconText() };
    case 'mode': {
      if (!c.argument) return { handled: true, message: 'Usage: /mode green | yellow | red', bad: true };
      const msg = changeZone(c.argument);
      return { handled: true, message: msg, bad: msg.startsWith('Invalid'),
               zone: zone, status: getStatus() };
    }
    case 'kb': {
      const arg = c.argument.toLowerCase();
      if (arg === 'open')  { kbToggle(true);  return { handled: true, message: '🗂 Knowledge base open.' }; }
      if (arg === 'close') { kbToggle(false); return { handled: true, message: '🗂 Knowledge base closed.' }; }
      if (arg === 'export') { kbToggle(true); kbExportTab(); return { handled: true }; }
      return { handled: true, markdown: true, message: kbStatusText() };
    }
    case 'find': {
      if (!c.argument) {
        return { handled: true, bad: true,
                 message: 'Usage: /find H5 (a cell) or /find <keywords>.' };
      }
      kbDoSearch(c.argument);
      return { handled: true, message: '🔎 Results are in the Knowledge Base drawer.' };
    }
    case 'export': {
      exportSession();
      return { handled: true };
    }
    case 'avatar': {
      const arg = c.argument.toLowerCase();
      if (arg === 'close') { avToggle(false); return { handled: true, message: 'Avatar view closed.' }; }
      avToggle(true);
      return { handled: true, message: 'Avatar view open — a live view of mode, load, activity and recall.' };
    }
    case 'keyboard': {
      const arg = c.argument.toLowerCase();
      if (arg === 'close') { kbdToggle(false); return { handled: true, message: 'Token keyboard closed.' }; }
      kbdToggle(true);
      return { handled: true, message: 'Token keyboard open — it is empty. The previous '
               + 'set was removed on 2026-10-17; a new one has not been added yet.' };
    }
    case 'sheet': {
      const arg = c.argument.toLowerCase();
      if (arg === 'close') { shToggle(false); return { handled: true, message: '📊 Sheets closed.' }; }
      if (arg === 'export') { shExportCSV(); return { handled: true }; }
      shToggle(true);
      return { handled: true, message: '📊 Sheets open — click a cell and type; a formula starts ' +
               'with = (try =SUM(A1:A5)). ⧉ CSV and ⬇ .csv carry the data out; 📋 Import brings it in.' };
    }
    case 'overlay': {
      const arg = c.argument.toLowerCase().replace(/[\s-]+/g, '_');
      if (!arg) {
        const lines = ['### Omega-1 behavioral overlays', ''];
        for (const [key, o] of Object.entries(OVERLAYS)) {
          lines.push(`- \`${key}\`${key === overlayMode ? ' — **active**' : ''} — ${o.blurb}`);
        }
        lines.push('', 'Switch with `/overlay <name>`. `/overlay off` returns to zone conditioning alone. ' +
          'An overlay shapes tone and pacing; the load dial (1–10) sets how much arrives at once.');
        return { handled: true, markdown: true, message: lines.join('\n') };
      }
      if (arg in OVERLAYS) {
        setOverlay(arg);   // notes for itself, crisis lifecycle included
        return { handled: true, status: getStatus() };
      }
      return { handled: true, bad: true, message: 'Unknown overlay: ' + c.argument + '. /overlay lists them.' };
    }
    case 'clear': {
      const cleared = store.raiseFloor();
      return { handled: true, clearLog: true,
               message: clearReport(cleared, store.archivedCount()), status: getStatus() };
    }
    case 'port':
      return { handled: true, markdown: true, message: PORT_NOTES };
    case 'help':
      return { handled: true, markdown: true, message: helpText() };
  }
  return { handled: true, message: `Unknown command: ${text.trim()}. Try /help`, bad: true };
}
