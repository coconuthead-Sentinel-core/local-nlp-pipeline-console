/* ---------- read-along (ported; speakable computed locally) ------------ */

const SENTENCE_END = /[.!?…]["')\]]*\s*/;

let readIndex = -1;
let readSpans = [];
let readQueue = [];
let readTurn = null;

function splitSentences(text) {
  const out = [];
  let rest = text;
  while (rest) {
    const m = rest.match(SENTENCE_END);
    if (!m) { out.push({ text: rest, ends: false }); break; }
    const cut = m.index + m[0].length;
    out.push({ text: rest.slice(0, cut), ends: true });
    rest = rest.slice(cut);
  }
  return out;
}

function wrapSentences(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    if (n.nodeValue.trim()) nodes.push(n);
  }

  const spans = [];
  const texts = [];
  let index = 0;

  for (const node of nodes) {
    if (node.parentElement && node.parentElement.closest('pre')) continue;
    const frag = document.createDocumentFragment();
    for (const piece of splitSentences(node.nodeValue)) {
      const span = document.createElement('span');
      span.className = 's';
      span.dataset.i = String(index);
      span.textContent = piece.text;
      frag.appendChild(span);
      if (!spans[index]) spans[index] = [];
      spans[index].push(span);
      texts[index] = (texts[index] || '') + piece.text;
      if (piece.ends) index += 1;
    }
    node.parentNode.replaceChild(frag, node);
  }
  return { spans: spans, texts: texts.map((t) => (t || '').trim()) };
}

function clearHighlight() {
  document.querySelectorAll('.s.reading').forEach((e) => e.classList.remove('reading'));
  document.querySelectorAll('.w.now').forEach((e) => e.classList.remove('now'));
}

function highlight(i) {
  clearHighlight();
  const group = readSpans[i];
  if (!group || !group.length) return;
  group.forEach((e) => e.classList.add('reading'));
  const first = group[0];
  const box = first.getBoundingClientRect();
  const view = log.getBoundingClientRect();
  if (box.top < view.top || box.bottom > view.bottom) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    first.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
  }
}

function wordify(i) {
  const group = readSpans[i];
  if (!group || !group.length || group[0].querySelector('.w')) return;
  for (const span of group) {
    const frag = document.createDocumentFragment();
    for (const part of span.textContent.split(/(\s+)/)) {
      if (!part) continue;
      if (/^\s+$/.test(part)) {
        frag.appendChild(document.createTextNode(part));
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      frag.appendChild(w);
    }
    span.textContent = '';
    span.appendChild(frag);
  }
}

function highlightWord(i, charIndex) {
  const group = readSpans[i];
  if (!group) return;
  const words = [];
  group.forEach((s) => s.querySelectorAll('.w').forEach((w) => words.push(w)));
  if (!words.length) return;

  const sentence = (readQueue[i] && readQueue[i].text) || '';
  let seen = 0;
  let target = words[0];
  for (const w of words) {
    const start = sentence.indexOf(w.textContent, seen);
    if (start < 0) continue;
    seen = start + w.textContent.length;
    if (start <= charIndex && charIndex < seen) { target = w; break; }
  }
  document.querySelectorAll('.w.now').forEach((e) => e.classList.remove('now'));
  target.classList.add('now');
}

function setRead(on) {
  const b = $('read');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.innerHTML = on ? '<span aria-hidden="true">■</span> Stop'
                   : '<span aria-hidden="true">🔊</span> Read';
}

function stopReading() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  speaking = false;
  readIndex = -1;
  clearHighlight();
  if (readTurn) readTurn.classList.remove('reading-on');
  setRead(false);
}

function speakFrom(start) {
  if (!('speechSynthesis' in window) || !readQueue.length) return;
  window.speechSynthesis.cancel();
  speaking = true;
  setRead(true);
  if (readTurn) readTurn.classList.add('reading-on');

  let last = -1;
  for (let i = start; i < readQueue.length; i += 1) {
    if (readQueue[i] && readQueue[i].spoken.trim()) last = i;
  }
  if (last < 0) { stopReading(); return; }

  for (let i = start; i < readQueue.length; i += 1) {
    const item = readQueue[i];
    if (!item || !item.spoken.trim()) continue;
    const utter = new SpeechSynthesisUtterance(item.spoken);
    utter.onstart = () => {
      readIndex = i;
      highlight(i);
      if (item.matches) wordify(i);
    };
    if (item.matches) {
      utter.onboundary = (e) => highlightWord(i, e.charIndex || 0);
    }
    if (i === last) utter.onend = () => stopReading();
    utter.onerror = () => stopReading();
    window.speechSynthesis.speak(utter);
  }
}

function speakPlain(text) {
  if (!text || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.onstart = () => { speaking = true; setRead(true); };
  utter.onend = () => { speaking = false; setRead(false); };
  utter.onerror = () => { speaking = false; setRead(false); };
  window.speechSynthesis.speak(utter);
}

function readAlong(turnEl, fallbackText) {
  if (!('speechSynthesis' in window)) {
    note('This window has no speech engine.', true);
    return;
  }
  const body = turnEl && turnEl.querySelector('.body');
  if (!body) { speakPlain(fallbackText); return; }

  readTurn = turnEl;
  const wrapped = wrapSentences(body);
  readSpans = wrapped.spans;
  const texts = wrapped.texts;
  if (!texts.filter((t) => t).length) { speakPlain(fallbackText); return; }

  /* The desktop shell asked Python for the spoken form of each sentence;
     here the same kernel runs locally, so alignment is still exact. */
  readQueue = texts.map((t) => {
    const shown = t || '';
    const spoken = speakable(shown);
    return { text: shown, spoken: spoken, matches: spoken === shown };
  });

  readSpans.forEach((group) => {
    if (!group) return;
    group.forEach((span) => {
      span.addEventListener('click', () => speakFrom(Number(span.dataset.i)));
    });
  });

  speakFrom(0);
}

/* ---------- export bridge ----------------------------------------------
 * The knowledge base's missing half: getting the FULL contents OUT of
 * this browser, so a handoff filed here can cross to whoever codes it.
 *
 * Textbook separation of concerns: the drawer's list view truncates
 * bodies for display — that is a VIEW decision — while export always
 * serializes from the data model, the single source of truth. So what
 * leaves the console is complete regardless of what the screen shows.
 *
 * Serialization: each item becomes a self-describing markdown record —
 * a heading, one metadata line (timestamps in ISO 8601), and the full
 * body — so a pasted handoff carries its own context. The serializers
 * are pure functions of the item; the one side effect, writing the
 * clipboard, is isolated in copyText() with a graceful-degradation
 * chain: the async Clipboard API where the browser grants it (this
 * page's hosting frame delegates clipboard-write), the legacy
 * textarea + execCommand path where it does not, and an honest failure
 * report when neither works. */

function kbIso(at) {
  try { return new Date(at).toISOString(); } catch (e) { return ''; }
}

/* Pure: item in, markdown record out. No DOM, no truncation. */
function kbSerialize(kind, x) {
  const meta = [];
  if (kind === 'card') {
    if (x.glyph) meta.push('glyph: ' + x.glyph);
    meta.push('cell: ' + (x.coord || '?'), 'zone: ' + (x.zone || '?'),
              'load: ' + (x.load || '?') + '/10');
  }
  if (x.at) meta.push('created: ' + kbIso(x.at));
  if (x.byAssistant) meta.push('author: assistant' + (x.reason ? ' (' + x.reason + ')' : ''));
  const title = x.title || x.term || (kind === 'journal' ? 'Journal entry' : 'Untitled');
  const body = (kind === 'term') ? (x.definition || '') : (x.body || '');
  /* A card's audit trail and relationships ride with the record —
     the export is the complete card, not just its current face. */
  let appendix = '';
  if (kind === 'card' && Array.isArray(x.glyphHistory) && x.glyphHistory.length) {
    appendix += '\nGlyph history:\n' + x.glyphHistory.map((h) =>
      '- ' + (h.glyph || '(none)') + ' until ' + kbIso(h.at) + ' (' + (h.by || '?') +
      (h.context ? ': ' + h.context : '') + ')').join('\n') + '\n';
  }
  if (kind === 'card' && Array.isArray(x.links) && x.links.length) {
    appendix += '\nLinks:\n' + x.links.map((l) => {
      const t = kb.data.cards.find((cc) => cc.id === l.target);
      return '- ' + l.type.replace('_', ' ') + ' → ' + (t ? t.title + ' (' + t.coord + ')' : 'a deleted card');
    }).join('\n') + '\n';
  }
  return '## [' + kind.toUpperCase() + '] ' + title + '\n' +
         (meta.length ? meta.join(' · ') + '\n' : '') + '\n' +
         body + '\n' + appendix;
}

/* The one side effect. Resolves true only when the text really landed
 * on the clipboard — callers report the outcome, never assume it. */
async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through to the legacy path */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return !!ok;
  } catch (e) { return false; }
}

async function kbCopyItem(kind, x) {
  const record = kbSerialize(kind, x);
  const ok = await copyText(record);
  note(ok
    ? '⧉ Copied in full — ' + record.length.toLocaleString() + ' characters ' +
      'to the clipboard as markdown. The on-screen preview clips at 700; ' +
      'the copy never does.'
    : '⧉ The browser refused clipboard access — the copy did not happen.', !ok);
}

/* Export the CURRENT tab as one package, honoring the card filters —
 * so "all GREEN 🔺 cards" is exactly one filter plus one click. */
function kbExportTab() {
  const items = [];
  if (kbTab === 'library') {
    kb.data.documents.forEach((d) => items.push(kbSerialize('document', d)));
  } else if (kbTab === 'cards') {
    let cards = kb.data.cards.slice();
    if (kbGlyphFilter) cards = cards.filter((c) => c.glyph === kbGlyphFilter);
    if (kbZoneFilter) cards = cards.filter((c) => c.zone === kbZoneFilter);
    cards.sort((a, b) => (a.load || 5) - (b.load || 5));
    cards.forEach((c) => items.push(kbSerialize('card', c)));
  } else if (kbTab === 'notes') {
    kb.data.notes.forEach((n) => items.push(kbSerialize('note', n)));
  } else if (kbTab === 'journal') {
    kb.data.journal.forEach((j) => items.push(kbSerialize('journal', j)));
  } else {
    kb.data.glossary.forEach((g) => items.push(kbSerialize('term', g)));
  }
  if (!items.length) {
    note('⧉ Nothing to export in this tab' +
         ((kbGlyphFilter || kbZoneFilter) ? ' under the current filter' : '') + '.', true);
    return;
  }
  const filterNote = (kbTab === 'cards' && (kbGlyphFilter || kbZoneFilter))
    ? ' · filter: ' + [kbGlyphFilter, kbZoneFilter].filter(Boolean).join(' ')
    : '';
  const pkg = '# Strata Console — knowledge base export\n' +
    'exported: ' + new Date().toISOString() + ' · tab: ' + kbTab + filterNote +
    ' · items: ' + items.length + '\n\n' +
    items.join('\n---\n\n');
  copyText(pkg).then((ok) => {
    note(ok
      ? '⧉ Exported ' + items.length + ' item(s) — ' + pkg.length.toLocaleString() +
        ' characters of markdown on the clipboard, full bodies included. ' +
        'Paste it wherever the handoff goes.'
      : '⧉ The browser refused clipboard access — the export did not happen.', !ok);
  });
}

/* ---------- knowledge base UI ------------------------------------------
 * A drawer with the Study Workstation's five tabs. Purely additive: it
 * renders into its own section and touches nothing the console already
 * owns. Everything here is escaped through the same esc() the transcript
 * uses — stored material is data, never trusted as HTML. */

const KB_TABS = [
  ['library',  '📚 Library'],
  ['cards',    '🗃 Cards'],
  ['notes',    '📝 Notes'],
  ['journal',  '📓 Journal'],
  ['glossary', '📖 Glossary'],
];
let kbTab = 'library';
let kbOpenState = false;
let kbGlyphFilter = '';   // '' = all glyphs
let kbZoneFilter = '';    // '' = all zones
let kbQuery = '';         // '' = no search — tabs show; set = results view

function kbToggle(open) {
  kbOpenState = (open === undefined) ? !kbOpenState : !!open;
  $('kb-panel').hidden = !kbOpenState;
  $('kb-open').setAttribute('aria-expanded', kbOpenState ? 'true' : 'false');
  if (kbOpenState) kbRender(); else kbBadge();
}

function kbEl(tag, cls, html) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (html !== undefined) el.innerHTML = html;
  return el;
}

function kbBtn(label, fn) {
  const b = kbEl('button', 'ctl');
  b.type = 'button';
  b.textContent = label;
  b.style.minHeight = '36px';
  b.style.padding = '6px 12px';
  b.style.fontSize = '.85em';
  b.addEventListener('click', fn);
  return b;
}

function kbWhen(at) {
  try { return new Date(at).toLocaleString(); } catch (e) { return ''; }
}

function kbItem(title, metaHtml, body, onDelete, onCopy) {
  const el = kbEl('div', 'kb-item');
  el.appendChild(kbEl('h4', '', esc(title)));
  if (metaHtml) el.appendChild(kbEl('div', 'kb-meta', metaHtml));
  /* Display truncates; export never does — see the export bridge. */
  if (body) el.appendChild(kbEl('div', 'kb-body', esc(String(body).slice(0, 700))));
  const row = kbEl('div', 'kb-row');
  if (onCopy) {
    const c = kbBtn('⧉ Copy', onCopy);
    c.title = 'Copy this item — the FULL body, not the preview — to the clipboard as markdown.';
    row.appendChild(c);
  }
  row.appendChild(kbBtn('Delete', onDelete));
  el.appendChild(row);
  return el;
}

function kbBadge() {
  const btn = $('kb-open');
  if (!btn) return;
  const n = kb.total();
  btn.innerHTML = '<span aria-hidden="true">🗂</span> Knowledge Base' +
    (n ? ' (' + n + ')' : '');
}

function kbRender() {
  const panel = $('kb-panel');
  if (!panel || panel.hidden) { kbBadge(); return; }
  const c = kb.counts();
  const countOf = { library: c.documents, cards: c.cards, notes: c.notes,
                    journal: c.journal, glossary: c.glossary };
  const tabs = panel.querySelector('.kb-tabs');
  tabs.innerHTML = '';
  KB_TABS.forEach(([id, label]) => {
    const b = kbEl('button', 'kb-tab');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', kbTab === id ? 'true' : 'false');
    b.textContent = label + (countOf[id] ? ' (' + countOf[id] + ')' : '');
    b.addEventListener('click', () => { kbTab = id; kbQuery = ''; kbRender(); });
    tabs.appendChild(b);
  });
  const ex = kbEl('button', 'kb-tab');
  ex.type = 'button';
  ex.textContent = '⧉ Export tab';
  ex.title = 'Copy every item in this tab — full bodies, honoring the current filters — to the clipboard as one markdown package.';
  ex.addEventListener('click', kbExportTab);
  tabs.appendChild(ex);
  const body = $('kb-body');
  body.innerHTML = '';
  if (kbQuery) kbRenderResults(body);
  else if (kbTab === 'library') kbRenderLibrary(body);
  else if (kbTab === 'cards') kbRenderCards(body);
  else if (kbTab === 'notes') kbRenderNotes(body);
  else if (kbTab === 'journal') kbRenderJournal(body);
  else kbRenderGlossary(body);
  kbBadge();
}

/* ---------- cell / keyword search --------------------------------------
 * One box, two behaviors, decided by the SHAPE of the query — a
 * classroom dispatch-on-input-form pattern:
 *   - a cell address (letter + 1–3 digits, e.g. H5) → direct lookup of
 *     the cards AT that cell, narrowed by the zone chips when one is
 *     picked — exactly "zone says where I look, cell says which";
 *   - anything else → the same ranked keyword search the assistant
 *     grounds in, across all five stores.
 * Results render in the drawer with the full Copy/Delete affordances;
 * choosing any tab clears the search. */

const KB_KIND_LIST = { document: 'documents', card: 'cards', note: 'notes',
                       journal: 'journal', term: 'glossary' };

function kbResolve(kind, id) {
  const list = kb.data[KB_KIND_LIST[kind]];
  return Array.isArray(list) ? list.find((x) => x.id === id) : null;
}

function kbResultItem(body, kind, x) {
  const title = x.title || x.term || (kind === 'journal' ? kbWhen(x.at) : 'Untitled');
  let meta = '<span>' + esc(kind) + '</span>';
  if (kind === 'card') {
    meta += (x.glyph ? '<span>' + esc(x.glyph) + '</span>' : '') +
      '<span class="kb-coord">' + esc(x.coord) + '</span>' +
      '<span class="kb-zone ' + esc(x.zone) + '">' + esc(x.zone) + '</span>' +
      '<span>load ' + x.load + '/10</span>';
  } else if (x.at) {
    meta += '<span>' + esc(kbWhen(x.at)) + '</span>';
  }
  const text = (kind === 'term') ? x.definition : x.body;
  body.appendChild(kbItem(title, meta, text,
    () => { kb.remove(KB_KIND_LIST[kind], x.id); note('🗂 Deleted: ' + title); kbRender(); },
    () => kbCopyItem(kind, x)));
}

function kbRenderResults(body) {
  const q = kbQuery.trim();
  const cellLike = /^[A-Za-z]\d{1,3}$/.test(q);
  const bar = kbEl('div', 'kb-row');
  const clear = kbBtn('✕ Clear search', () => { kbQuery = ''; $('kb-q').value = ''; kbRender(); });
  bar.appendChild(clear);
  if (cellLike) {
    /* Zone chips: "the zone determines where I'm looking". */
    ['GREEN', 'YELLOW', 'RED'].forEach((z) => {
      const b = kbBtn(z, () => { kbZoneFilter = (kbZoneFilter === z) ? '' : z; kbRender(); });
      b.setAttribute('aria-pressed', kbZoneFilter === z ? 'true' : 'false');
      if (kbZoneFilter === z) { b.style.background = 'var(--fill)'; b.style.fontWeight = '600'; }
      bar.appendChild(b);
    });
  }
  body.appendChild(bar);

  if (cellLike) {
    const coord = q.toUpperCase();
    let cards = kb.data.cards.filter((c) => c.coord === coord);
    if (kbZoneFilter) cards = cards.filter((c) => c.zone === kbZoneFilter);
    body.appendChild(kbEl('div', 'kb-meta',
      'Cell <span class="kb-coord">' + esc(coord) + '</span>' +
      (kbZoneFilter ? ' in ' + esc(kbZoneFilter) : ' in all zones') +
      ' — ' + cards.length + ' card' + (cards.length === 1 ? '' : 's')));
    if (!cards.length) {
      body.appendChild(kbEl('div', 'kb-empty', 'No card at ' + esc(coord) +
        (kbZoneFilter ? ' in ' + esc(kbZoneFilter) + ' — try another zone chip or none' : '') + '.'));
      return;
    }
    cards.forEach((c) => kbResultItem(body, 'card', c));
    return;
  }

  const hits = kbSearch(q, 12);
  body.appendChild(kbEl('div', 'kb-meta',
    '‘' + esc(q) + '’ — ' + hits.length + ' match' + (hits.length === 1 ? '' : 'es') +
    ' across all five stores, best first'));
  if (!hits.length) {
    body.appendChild(kbEl('div', 'kb-empty', 'Nothing matched. Fewer or different words often help.'));
    return;
  }
  hits.forEach((h) => {
    const x = kbResolve(h.kind, h.id);
    if (x) kbResultItem(body, h.kind, x);
  });
}

/* ---------- portable session context (Spec 5, the piece that fits) ----
 * The handoff's multi-model orchestration mostly dissolves here: this
 * page holds no API keys, manages no rate limits, and is structurally
 * Claude-only. What survives — and matters — is CONTEXT SERIALIZATION:
 * one command that packages the session's state as a self-describing
 * markdown block the user carries to whichever assistant works next.
 * The human is the bridge; this hands them the complete suitcase. */
function exportSession() {
  const turns = store.recallTurns(24, 60000);
  const c = kb.counts();
  const pkg = '# Strata Console — portable session context\n' +
    'exported: ' + new Date().toISOString() + '\n' +
    'mode: ' + zone + ' (' + (ZONE_MEANING[zone] || '?') + ') · overlay: ' +
    (overlayMode === 'off' ? 'off' : overlayMode) + ' · target load: ' + cogLoad + '/10\n' +
    'active glyphs (latest message): ' + (avGlyphs.length ? avGlyphs.join(' ') : 'none') + '\n' +
    'knowledge base: ' + c.cards + ' cards · ' + c.documents + ' documents · ' +
    c.notes + ' notes · ' + c.journal + ' journal · ' + c.glossary + ' glossary\n' +
    'attachment: ' + (attachment ? (attachment.image ? '🖼 ' : '📎 ') + attachment.name : 'none') + '\n\n' +
    '## Conversation recall (' + turns.length + ' turn' + (turns.length === 1 ? '' : 's') + ', oldest first)\n\n' +
    (turns.length
      ? turns.map((t) => '**' + t.role + ':** ' + t.content).join('\n\n')
      : '(nothing above the clear floor)') + '\n';
  copyText(pkg).then((ok) => {
    note(ok
      ? '⧉ Session context exported — ' + pkg.length.toLocaleString() +
        ' characters on the clipboard. Paste it to any assistant to continue ' +
        'with this session\'s full context.'
      : '⧉ The browser refused clipboard access — the export did not happen.', !ok);
  });
}

function kbDoSearch(q) {
  kbQuery = String(q || '').trim();
  if ($('kb-q')) $('kb-q').value = kbQuery;
  kbToggle(true);
  kbRender();
}

function kbRenderLibrary(body) {
  const form = kbEl('div', 'kb-form');
  form.innerHTML =
    '<label for="kb-doc-title">Title</label>' +
    '<input type="text" id="kb-doc-title" placeholder="e.g. Chapter 3 — the box model">' +
    '<label for="kb-doc-body">Text (paste a passage)</label>' +
    '<textarea id="kb-doc-body"></textarea>';
  const row = kbEl('div', 'kb-row');
  row.appendChild(kbBtn('Add to library', () => {
    const t = $('kb-doc-title').value.trim();
    const b = $('kb-doc-body').value;
    if (!b.trim()) { note('🗂 Paste some text first.', true); return; }
    kb.addDocument(t, b);
    note('🗂 Added to the library' + (t ? ': ' + t : '') + '.');
    kbRender();
  }));
  row.appendChild(kbBtn('Upload file…', () => $('kb-file').click()));
  form.appendChild(row);
  body.appendChild(form);
  if (!kb.data.documents.length) {
    body.appendChild(kbEl('div', 'kb-empty', 'No documents yet — paste a passage or upload a text file.'));
    return;
  }
  kb.data.documents.forEach((d) => {
    const sizeKB = Math.max(1, Math.round(d.body.length / 1024));
    body.appendChild(kbItem(d.title,
      esc(kbWhen(d.at)) + ' · ' + sizeKB + ' KB',
      d.body,
      () => { kb.remove('documents', d.id); note('🗂 Document deleted: ' + d.title); kbRender(); },
      () => kbCopyItem('document', d)));
  });
}

function kbRenderCards(body) {
  const form = kbEl('div', 'kb-form');
  form.innerHTML =
    '<label for="kb-card-title">Title</label><input type="text" id="kb-card-title">' +
    '<label for="kb-card-body">Body</label><textarea id="kb-card-body"></textarea>' +
    '<div class="kb-row" style="align-items:flex-end">' +
    '<div style="flex:1 1 90px"><label for="kb-card-coord">Cell (A1–Z999)</label>' +
    '<input type="text" id="kb-card-coord" value="D3"></div>' +
    '<div style="flex:1 1 110px"><label for="kb-card-zone">Zone</label>' +
    '<select id="kb-card-zone"><option>GREEN</option><option>YELLOW</option><option>RED</option></select></div>' +
    '<div style="flex:1 1 90px"><label for="kb-card-load">Load (1–10)</label>' +
    '<input type="text" id="kb-card-load" value="5"></div>' +
    '<div style="flex:1 1 150px"><label for="kb-card-glyph">Glyph</label>' +
    '<select id="kb-card-glyph"><option value="">— none —</option>' +
    GLYPHS.map((g) => '<option value="' + g.glyph + '">' + g.glyph + ' ' + g.name + '</option>').join('') +
    '</select></div>' +
    '</div>';
  const row = kbEl('div', 'kb-row');
  row.appendChild(kbBtn('Add card', () => {
    const t = $('kb-card-title').value.trim();
    if (!t) { note('🗂 A card needs a title.', true); return; }
    const c = kb.addCard({
      title: t,
      body: $('kb-card-body').value,
      coord: $('kb-card-coord').value.trim(),
      zone: $('kb-card-zone').value,
      load: parseInt($('kb-card-load').value, 10),
      glyph: $('kb-card-glyph').value,
    });
    note('🗂 Card added at ' + c.coord + (c.glyph ? ' ' + c.glyph : '') + ': ' + c.title);
    kbRender();
  }));
  form.appendChild(row);
  body.appendChild(form);
  if (!kb.data.cards.length) {
    body.appendChild(kbEl('div', 'kb-empty', 'No cards yet.'));
    return;
  }

  /* v2 filtering: glyph + zone chips, and the list ordered by cognitive
     load, low → high — the lightest lift always sits on top. */
  const filt = kbEl('div', 'kb-row');
  const chip = (label, active, fn) => {
    const b = kbBtn(label, fn);
    b.setAttribute('aria-pressed', active ? 'true' : 'false');
    if (active) { b.style.background = 'var(--fill)'; b.style.fontWeight = '600'; }
    return b;
  };
  filt.appendChild(chip('All', !kbGlyphFilter && !kbZoneFilter,
    () => { kbGlyphFilter = ''; kbZoneFilter = ''; kbRender(); }));
  ['GREEN', 'YELLOW', 'RED'].forEach((z) => filt.appendChild(
    chip(z, kbZoneFilter === z, () => { kbZoneFilter = (kbZoneFilter === z) ? '' : z; kbRender(); })));
  [...new Set(kb.data.cards.map((c) => c.glyph).filter(Boolean))].forEach((g) => filt.appendChild(
    chip(g, kbGlyphFilter === g, () => { kbGlyphFilter = (kbGlyphFilter === g) ? '' : g; kbRender(); })));
  body.appendChild(filt);

  let cards = kb.data.cards.slice();
  if (kbGlyphFilter) cards = cards.filter((c) => c.glyph === kbGlyphFilter);
  if (kbZoneFilter) cards = cards.filter((c) => c.zone === kbZoneFilter);
  cards.sort((a, b) => (a.load || 5) - (b.load || 5));
  if (!cards.length) {
    body.appendChild(kbEl('div', 'kb-empty', 'No cards match this filter.'));
    return;
  }
  cards.forEach((c) => {
    const meta = (c.glyph ? '<span>' + esc(c.glyph) + '</span>' : '') +
      '<span class="kb-coord">' + esc(c.coord) + '</span>' +
      '<span class="kb-zone ' + esc(c.zone) + '">' + esc(c.zone) + '</span>' +
      '<span>load ' + c.load + '/10</span>' +
      (c.glyphHistory && c.glyphHistory.length
        ? '<span title="glyph changes recorded in this card\'s history">↺ ' + c.glyphHistory.length + '</span>' : '') +
      (c.links && c.links.length
        ? '<span title="links to other cards — the full list rides with ⧉ Copy">🔗 ' + c.links.length + '</span>' : '') +
      (c.byAssistant
        ? '<span>🤖 assistant' + (c.reason ? ' — ' + esc(c.reason) : '') + '</span>'
        : '');
    body.appendChild(kbItem(c.title, meta, c.body,
      () => { kb.remove('cards', c.id); note('🗂 Card deleted: ' + c.title); kbRender(); },
      () => kbCopyItem('card', c)));
  });
}
